(function () {
  const { problem, V, Heap } = TL;
  const { arr, vars, intervals: iv } = V;
  const fmtI = (list) => list.map((x) => `[${x[0]},${x[1]}]`);
  const ivOk = (k, n) => (i) => (i[k].length > n ? `Keep to ${n} intervals.` : i[k].some((x) => x[0] > x[1]) ? 'Each interval needs start ≤ end.' : null);

  problem({
    id: 'insert-interval', n: 57, title: 'Insert Interval', diff: 'Medium', pattern: 'intervals', blind: true,
    prompt: 'Insert a new interval into a sorted list of non-overlapping intervals, merging where needed.',
    insight: 'The list splits into three runs: intervals entirely before the new one, intervals that overlap it (merge them all into it), and intervals entirely after.',
    approach: ['Copy intervals that end before new starts.', 'While intervals start before new ends, absorb them into new.', 'Add new, then copy the rest.'],
    pitfalls: ['Overlap test uses <=: [1,2] and [2,3] touch and merge.', 'Sorting again is unnecessary; the input is already sorted.'],
    time: 'O(n)', space: 'O(n)',
    code: `
def insert(intervals, new):
    res, i, n = [], 0, len(intervals)
    while i < n and intervals[i][1] < new[0]:
        res.append(intervals[i]); i += 1          #@before
    while i < n and intervals[i][0] <= new[1]:
        new = [min(new[0], intervals[i][0]),
               max(new[1], intervals[i][1])]      #@merge
        i += 1
    res.append(new)                               #@place
    res.extend(intervals[i:])                     #@after
    return res`,
    inputs: [{ label: 'Merge three', v: { intervals: [[1, 2], [3, 5], [6, 7], [8, 10], [12, 16]], new: [4, 8] }, expect: [[1, 2], [3, 10], [12, 16]] }, { label: 'No overlap', v: { intervals: [[1, 3], [6, 9]], new: [4, 5] }, expect: [[1, 3], [4, 5], [6, 9]] }],
    validate: ivOk('intervals', 9),
    run({ intervals: L, new: nw }, T) {
      const res = []; let i = 0, cur = nw.slice();
      const view = (hl, extra) => iv('intervals + new (dashed)', [...L, cur], { hl: { ...hl, [L.length]: 'new' }, ...extra });
      T.step('before', `Insert [${nw}].`, view({}), arr('res', fmtI(res), { noidx: true }));
      while (i < L.length && L[i][1] < cur[0]) {
        res.push(L[i]);
        T.step('before', `[${L[i]}] ends before ${cur[0]}. Copy it.`, view({ [i]: 'ok' }), arr('res', fmtI(res), { noidx: true, hl: { [res.length - 1]: 'ok' } }));
        i++;
      }
      while (i < L.length && L[i][0] <= cur[1]) {
        cur = [Math.min(cur[0], L[i][0]), Math.max(cur[1], L[i][1])];
        T.step('merge', `[${L[i]}] overlaps. Absorb it: new = [${cur}].`, view({ [i]: 'a' }), arr('res', fmtI(res), { noidx: true }));
        i++;
      }
      res.push(cur);
      T.step('place', `Add the merged [${cur}].`, view({}), arr('res', fmtI(res), { noidx: true, hl: { [res.length - 1]: 'a' } }));
      const rest = L.slice(i); res.push(...rest);
      T.step('after', rest.length ? `Copy the ${rest.length} interval(s) after it.` : 'Nothing comes after.', iv('result', res, { hl: { [res.indexOf(cur)]: 'a' } }), arr('res', fmtI(res), { noidx: true }));
      return res;
    },
  });

  problem({
    id: 'merge-intervals', n: 56, title: 'Merge Intervals', diff: 'Medium', pattern: 'intervals', blind: true,
    prompt: 'Merge all overlapping intervals.',
    insight: 'After sorting by start, an interval can only overlap the last merged one. Extend it or start a new one.',
    approach: ['Sort by start.', 'If start ≤ last end, extend last end.', 'Otherwise append a new interval.'],
    pitfalls: ['Extend with max(last end, e), not e: [1,10] then [2,3].', 'Without sorting, overlaps can be far apart.'],
    time: 'O(n log n)', space: 'O(n)',
    code: `
def merge(intervals):
    intervals.sort()                              #@sort
    res = [intervals[0]]
    for s, e in intervals[1:]:
        if s <= res[-1][1]:
            res[-1][1] = max(res[-1][1], e)       #@extend
        else:
            res.append([s, e])                    #@new
    return res`,
    inputs: [{ label: 'Classic', v: { intervals: [[8, 10], [1, 3], [2, 6], [15, 18]] }, expect: [[1, 6], [8, 10], [15, 18]] }, { label: 'Nested', v: { intervals: [[1, 10], [2, 3], [4, 12], [13, 14], [14, 15]] }, expect: [[1, 12], [13, 15]] }],
    validate: ivOk('intervals', 9),
    run({ intervals: L }, T) {
      L.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
      const res = [L[0].slice()];
      T.step('sort', 'Sorted by start. Begin with the first interval.', iv('sorted input', L, { hl: { 0: 'ok' } }), iv('merged', res, { min: L[0][0] }));
      for (let i = 1; i < L.length; i++) {
        const [s, e] = L[i], last = res[res.length - 1];
        if (s <= last[1]) {
          const oldEnd = last[1];
          last[1] = Math.max(last[1], e);
          T.step('extend', `[${s},${e}] starts at ${s} ≤ ${oldEnd}, the last end: overlap. Last becomes [${last}].`, iv('sorted input', L, { hl: { [i]: 'a' }, sweep: s }), iv('merged', res, { hl: { [res.length - 1]: 'a' }, min: L[0][0] }));
        } else {
          res.push([s, e]);
          T.step('new', `[${s},${e}] starts after ${last[1]}. Start a new interval.`, iv('sorted input', L, { hl: { [i]: 'ok' }, sweep: s }), iv('merged', res, { hl: { [res.length - 1]: 'ok' }, min: L[0][0] }));
        }
      }
      return res;
    },
  });

  problem({
    id: 'non-overlapping-intervals', n: 435, title: 'Non-overlapping Intervals', diff: 'Medium', pattern: 'intervals', blind: true,
    prompt: 'Return the minimum number of intervals to remove so the rest do not overlap.',
    insight: 'Keep as many as possible: sort by end time and greedily keep each interval that starts after the last kept one ends. The earliest end leaves the most room.',
    approach: ['Sort by end.', 'If start ≥ last kept end, keep it.', 'Otherwise remove it (count it).'],
    pitfalls: ['Sorting by start needs extra logic (drop the one that ends later).', 'Touching intervals [1,2], [2,3] do not overlap here.'],
    time: 'O(n log n)', space: 'O(1)',
    code: `
def eraseOverlapIntervals(intervals):
    intervals.sort(key=lambda x: x[1])            #@sort
    end, removed = float('-inf'), 0
    for s, e in intervals:
        if s >= end:
            end = e                               #@keep
        else:
            removed += 1                          #@drop
    return removed`,
    inputs: [{ label: 'Classic', v: { intervals: [[1, 2], [2, 3], [3, 4], [1, 3]] }, expect: 1 }, { label: 'Long one', v: { intervals: [[1, 11], [2, 4], [4, 6], [6, 9], [3, 5]] }, expect: 2 }],
    validate: ivOk('intervals', 9),
    run({ intervals: L }, T) {
      L.sort((a, b) => a[1] - b[1]);
      let end = -Infinity, removed = 0; const hl = {};
      T.step('sort', 'Sorted by end time.', iv('intervals (by end)', L, {}), vars({ end: '-∞', removed }));
      L.forEach(([s, e], i) => {
        if (s >= end) { end = e; hl[i] = 'ok'; T.step('keep', `[${s},${e}] starts at or after ${i ? 'the last kept end' : '-∞'}. Keep it; end = ${e}.`, iv('intervals (by end)', L, { hl: { ...hl, [i]: 'a' }, sweep: e }), vars({ end, removed })); }
        else { removed++; hl[i] = 'bad'; T.step('drop', `[${s},${e}] starts before ${end}. Remove it.`, iv('intervals (by end)', L, { hl: { ...hl }, sweep: end }), vars({ end, removed })); }
      });
      return removed;
    },
  });

  problem({
    id: 'meeting-rooms', n: 252, title: 'Meeting Rooms', diff: 'Easy', pattern: 'intervals', blind: true,
    prompt: 'Can one person attend all meetings (no two overlap)?',
    insight: 'Sort by start time. Any overlap must then appear between two neighbours.',
    approach: ['Sort by start.', 'If a meeting starts before the previous one ends, return False.'],
    pitfalls: ['A meeting that starts exactly when another ends is fine.'],
    time: 'O(n log n)', space: 'O(1)',
    code: `
def canAttendMeetings(intervals):
    intervals.sort()                              #@sort
    for i in range(1, len(intervals)):
        if intervals[i][0] < intervals[i - 1][1]:
            return False                          #@clash
    return True                                   #@ret`,
    inputs: [{ label: 'Clash', v: { intervals: [[0, 30], [5, 10], [15, 20]] }, expect: false }, { label: 'Fine', v: { intervals: [[7, 10], [2, 4], [4, 6]] }, expect: true }],
    validate: ivOk('intervals', 9),
    run({ intervals: L }, T) {
      L.sort((a, b) => a[0] - b[0]);
      T.step('sort', 'Sorted by start time.', iv('meetings', L, {}));
      for (let i = 1; i < L.length; i++) {
        if (L[i][0] < L[i - 1][1]) { T.step('clash', `[${L[i]}] starts before [${L[i - 1]}] ends. Clash.`, iv('meetings', L, { hl: { [i]: 'bad', [i - 1]: 'bad' }, sweep: L[i][0] })); return false; }
        T.step('ret', `[${L[i]}] starts after [${L[i - 1]}] ends. OK.`, iv('meetings', L, { hl: { [i]: 'ok', [i - 1]: 'ok' }, sweep: L[i][0] }));
      }
      T.step('ret', 'No clashes.', iv('meetings', L, {}));
      return true;
    },
  });

  problem({
    id: 'meeting-rooms-ii', n: 253, title: 'Meeting Rooms II', diff: 'Medium', pattern: 'intervals', blind: true,
    prompt: 'Return the minimum number of rooms needed to hold all meetings.',
    insight: 'Process meetings by start time with a min-heap of end times (one per room in use). If the earliest-ending room is free by now, reuse it; otherwise open a new room.',
    approach: ['Sort by start.', 'If heap[0] <= start, pop it (that room is free).', 'Push this meeting\'s end. The heap size at the end is the answer.'],
    pitfalls: ['Two sorted arrays of starts and ends (sweep line) is an equivalent answer.', 'Reuse only when the end is ≤ start.'],
    time: 'O(n log n)', space: 'O(n)',
    code: `
def minMeetingRooms(intervals):
    intervals.sort()                              #@sort
    ends = []                    # min-heap of end times
    for s, e in intervals:
        if ends and ends[0] <= s:
            heapq.heappop(ends)                   #@reuse
        heapq.heappush(ends, e)                   #@push
    return len(ends)                              #@ret`,
    inputs: [{ label: 'Classic', v: { intervals: [[0, 30], [5, 10], [15, 20]] }, expect: 2 }, { label: 'Busy', v: { intervals: [[1, 5], [2, 6], [3, 7], [5, 8], [6, 9], [8, 10]] }, expect: 3 }],
    validate: ivOk('intervals', 9),
    run({ intervals: L }, T) {
      L.sort((a, b) => a[0] - b[0]);
      const h = new Heap(); let peak = 0;
      const hv = () => arr('end times in use (min-heap, sorted)', h.a.slice().sort((a, b) => a - b), { noidx: true });
      T.step('sort', 'Sorted by start. Each heap entry is a room, keyed by when it frees up.', iv('meetings', L, {}), hv(), vars({ rooms: 0 }));
      L.forEach(([s, e], i) => {
        if (h.size && h.peek() <= s) {
          const free = h.pop();
          T.step('reuse', `A room frees at ${free} ≤ ${s}. Reuse it.`, iv('meetings', L, { hl: { [i]: 'ok' }, sweep: s }), hv(), vars({ rooms: h.size }));

        T.step('push', `Meeting [${s},${e}] occupies a room until ${e}. Rooms in use: ${h.size}.`, iv('meetings', L, { hl: { [i]: 'a' }, sweep: s }), hv(), vars({ rooms: h.size }));
      });
      T.step('ret', `${h.size} room(s) needed.`, iv('meetings', L, {}), hv(), vars({ rooms: h.size }));
      return h.size;
    },
  });
})();

(function () {
  const { problem, V } = TL;
  const { arr, vars, grid, bits } = V;
  const sq = (k, n) => (i) => (i[k].length > n || i[k][0].length > n ? `Keep the matrix to ${n} × ${n}.` : null);

  problem({
    id: 'rotate-image', n: 48, title: 'Rotate Image', diff: 'Medium', pattern: 'matrix', blind: true,
    prompt: 'Rotate an n × n matrix 90° clockwise, in place.',
    insight: 'A clockwise rotation = transpose (swap across the main diagonal) + reverse each row. Both steps are easy to do in place.',
    approach: ['Swap m[i][j] with m[j][i] for j > i.', 'Reverse every row.'],
    pitfalls: ['Transposing over all j (not j > i) swaps every pair twice and undoes itself.', 'Counter-clockwise = transpose + reverse each column.'],
    time: 'O(n²)', space: 'O(1)',
    code: `
def rotate(matrix):
    n = len(matrix)
    for i in range(n):
        for j in range(i + 1, n):
            matrix[i][j], matrix[j][i] = matrix[j][i], matrix[i][j]   #@transpose
    for row in matrix:
        row.reverse()                                                 #@reverse`,
    inputs: [{ label: '3 × 3', v: { matrix: [[1, 2, 3], [4, 5, 6], [7, 8, 9]] }, expect: [[7, 4, 1], [8, 5, 2], [9, 6, 3]] }, { label: '4 × 4', v: { matrix: [[5, 1, 9, 11], [2, 4, 8, 10], [13, 3, 6, 7], [15, 14, 12, 16]] }, expect: [[15, 13, 2, 5], [14, 3, 4, 1], [12, 6, 8, 9], [16, 7, 10, 11]] }],
    validate: sq('matrix', 6),
    run({ matrix: m }, T) {

    code: `
def checkInclusion(s1, s2):
    k = len(s1)
    need = Counter(s1)                    #@need
    window = Counter(s2[:k])
    if window == need:
        return True                       #@first
    for r in range(k, len(s2)):
        window[s2[r]] += 1                #@slide
        window[s2[r - k]] -= 1
        if window[s2[r - k]] == 0:
            del window[s2[r - k]]
        if window == need:
            return True                   #@match
    return False                          #@none`,
    inputs: [{ label: 'Found', v: { s1: 'ab', s2: 'eidbaooo' }, expect: true }, { label: 'Not found', v: { s1: 'ab', s2: 'eidboaoo' }, expect: false }, { label: 'Longer', v: { s1: 'abc', s2: 'xxcbbacay' }, expect: true }],

    run({ s1, s2 }, T) {

      for (const c of s1) need[c] = (need[c] || 0) + 1;
      for (const c of s2.slice(0, k)) win[c] = (win[c] || 0) + 1;
      const eq = () => { const ks = new Set([...Object.keys(need), ...Object.keys(win)]); for (const x of ks) if ((need[x] || 0) !== (win[x] || 0)) return false; return true; };
      const hl = (l, r, cls) => { const h = {}; for (let i = l; i <= r; i++) h[i] = cls; return h; };

      for (let r = k; r < s2.length; r++) {

class MinStack:
    def __init__(self):
        self.stack = []      # (value, min so far)       #@init
    def push(self, val):
        m = min(val, self.stack[-1][1]) if self.stack else val
        self.stack.append((val, m))                      #@push
    def pop(self):
        self.stack.pop()                                 #@pop
    def top(self):
        return self.stack[-1][0]                         #@top
    def getMin(self):
        return self.stack[-1][1]                         #@min`,

def evalRPN(tokens):
    stack = []                                  #@init

        if t in ('+', '-', '*', '/'):
            b, a = stack.pop(), stack.pop()     #@op
            if t == '+': stack.append(a + b)
            elif t == '-': stack.append(a - b)
            elif t == '*': stack.append(a * b)

    return stack[0]                             #@ret`,

def findMedianSortedArrays(a, b):
    if len(a) > len(b):
        a, b = b, a
    m, n = len(a), len(b)
    half = (m + n + 1) // 2
    lo, hi = 0, m                                   #@init
    while lo <= hi:
        i = (lo + hi) // 2           # take i from a
        j = half - i                 # and j from b    #@cut
        aL = a[i - 1] if i > 0 else float('-inf')
        aR = a[i] if i < m else float('inf')
        bL = b[j - 1] if j > 0 else float('-inf')
        bR = b[j] if j < n else float('inf')
        if aL <= bR and bL <= aR:
            if (m + n) % 2:
                return max(aL, bL)                  #@odd
            return (max(aL, bL) + min(aR, bR)) / 2  #@even
        if aL > bR:

        else:

      }
      return null;
    },
  });

class LRUCache:
    def __init__(self, capacity):
        self.cap = capacity
        self.cache = OrderedDict()          # oldest first   #@init
    def get(self, key):
        if key not in self.cache:
            return -1                       #@miss
        self.cache.move_to_end(key)         #@hit
        return self.cache[key]
    def put(self, key, value):
        if key in self.cache:
            self.cache.move_to_end(key)
        self.cache[key] = value             #@put
        if len(self.cache) > self.cap:

def diameterOfBinaryTree(root):
    best = 0
    def height(node):
        nonlocal best
        if not node:
            return 0
        L, R = height(node.left), height(node.right)
        best = max(best, L + R)              #@best
        return 1 + max(L, R)                 #@ret
    height(root)
    return best`,
    inputs: [{ label: 'Classic', v: { root: [1, 2, 3, 4, 5] }, expect: 3 }, { label: 'Off-root', v: { root: [1, 2, null, 3, 4, 5, null, null, 6, 7, null, null, 8] }, expect: 6 }],
    validate: treeOk(15),
    run({ root: R }, T) {
      const root = buildTree(R), tags = [];
      let best = 0, bestN = null;
      const go = (n) => {
        if (!n) return 0;
        const l = go(n.left), r = go(n.right);
        if (l + r > best) { best = l + r; bestN = n; }
        T.step('best', `At ${n.val}: left height ${l} + right height ${r} = ${l + r} edges through here. best = ${best}.`, tv('tree', root, { hl: [[n, 'a'], bestN && bestN !== n ? [bestN, 'ok'] : null], tags }), vars({ L: l, R: r, best }));
        tags.push([n, 'h=' + (1 + Math.max(l, r))]);
        T.step('ret', `Return height ${1 + Math.max(l, r)} to the parent.`, tv('tree', root, { hl: [[n, 'done'], bestN ? [bestN, 'ok'] : null], tags }), vars({ best }));
        return 1 + Math.max(l, r);
      };
      go(root);
      return best;
    },
  });

  problem({
    id: 'balanced-binary-tree', n: 110, title: 'Balanced Binary Tree', diff: 'Easy', pattern: 'trees',
    prompt: 'Is the tree height-balanced (at every node, subtree heights differ by at most 1)?',
    insight: 'Compute heights bottom-up and use −1 as a "not balanced" signal that propagates to the top. One pass, no recomputation.',
    approach: ['height(None) = 0.', 'If a child returned −1, or |L − R| > 1, return −1.', 'Else return 1 + max(L, R).'],
    pitfalls: ['Calling a separate height() at every node is O(n²).', 'Checking only the root misses deep imbalance.'],
    invariant: 'A finished node returns its height if its subtree is balanced, or −1 if not.',
    time: 'O(n)', space: 'O(h)',
    code: `
def isBalanced(root):
    def height(node):          # -1 means unbalanced
        if not node:
            return 0
        L = height(node.left)
        R = height(node.right)
        if L < 0 or R < 0 or abs(L - R) > 1:
            return -1                          #@bad
        return 1 + max(L, R)                   #@ret
    return height(root) >= 0                   #@start`,
    inputs: [{ label: 'Balanced', v: { root: [3, 9, 20, null, null, 15, 7] }, expect: true }, { label: 'Unbalanced', v: { root: [1, 2, 2, 3, 3, null, null, 4, 4] }, expect: false }],
    validate: treeOk(15),
    run({ root: R }, T) {
      const root = buildTree(R), tags = [];
      T.step('start', 'Heights come back up from the leaves; −1 means "already unbalanced".', tv('tree', root, {}));
      const go = (n) => {
        if (!n) return 0;
        const l = go(n.left), r = go(n.right);
        if (l < 0 || r < 0 || Math.abs(l - r) > 1) {
          tags.push([n, '-1']);
          T.step('bad', l < 0 || r < 0 ? `A subtree of ${n.val} is unbalanced. Pass −1 up.` : `At ${n.val}: heights ${l} and ${r} differ by ${Math.abs(l - r)} > 1. Return −1.`, tv('tree', root, { hl: [[n, 'bad']], tags }), vars({ L: l, R: r }));
          return -1;
        }
        tags.push([n, 'h=' + (1 + Math.max(l, r))]);
        T.step('ret', `At ${n.val}: heights ${l} and ${r} are within 1. Return ${1 + Math.max(l, r)}.`, tv('tree', root, { hl: [[n, 'ok']], tags }), vars({ L: l, R: r }));
        return 1 + Math.max(l, r);
      };
      const h = go(root);
      T.step('start', h >= 0 ? 'Root returned a height. Balanced.' : 'Root returned −1. Not balanced.', tv('tree', root, { tags }));
      return h >= 0;
    },
  });

  problem({
    id: 'binary-tree-right-side-view', n: 199, title: 'Binary Tree Right Side View', diff: 'Medium', pattern: 'trees',
    prompt: 'Looking at the tree from the right, which values can you see, top to bottom?',
    insight: 'You see exactly the last node of each level. BFS level by level and keep the last one.',
    approach: ['BFS with a level size snapshot.', 'The node at i == n − 1 of each level is visible.'],
    pitfalls: ['Following only right children misses left nodes that stick out on deeper levels.', 'DFS visiting right first, recording the first node per depth, also works.'],
    invariant: 'res holds the rightmost node of every finished level.',
    time: 'O(n)', space: 'O(width)',
    code: `
def rightSideView(root):
    res, q = [], deque([root] if root else [])
    while q:
        n = len(q)
        for i in range(n):
            node = q.popleft()
            if i == n - 1:
                res.append(node.val)          #@see
            if node.left: q.append(node.left)
            if node.right: q.append(node.right)   #@push
    return res`,
    inputs: [{ label: 'Left sticks out', v: { root: [1, 2, 3, null, 5, null, 4, 6] }, expect: [1, 3, 4, 6] }],
    validate: treeOk(15),
    run({ root: R }, T) {
      const root = buildTree(R), res = [], seen = [];
      let q = root ? [root] : [];
      while (q.length) {
        const n = q.length;
        for (let i = 0; i < n; i++) {
          const node = q.shift();
          if (node.left) q.push(node.left);
          if (node.right) q.push(node.right);
          if (i === n - 1) { res.push(node.val); seen.push(node); T.step('see', `${node.val} is the last node of its level: visible from the right.`, tv('tree', root, { hl: [...seen.map((x) => [x, 'ok']), [node, 'a']] }), arr('queue', q.map((x) => x.val), { noidx: true }), arr('res', res, { hl: { [res.length - 1]: 'a' } })); }
          else T.step('push', `${node.val} is hidden behind a node to its right.`, tv('tree', root, { hl: [...seen.map((x) => [x, 'ok']), [node, 'mute']] }), arr('queue', q.map((x) => x.val), { noidx: true }), arr('res', res));
        }
      }
      return res;
    },
  });

  problem({
    id: 'count-good-nodes-in-binary-tree', n: 1448, title: 'Count Good Nodes in Binary Tree', diff: 'Medium', pattern: 'trees',
    prompt: 'A node is good if no node on the path from the root to it has a larger value. Count good nodes.',
    insight: 'Pass the maximum value seen on the path down. A node is good if it is at least that maximum.',
    approach: ['dfs(node, best): good if node.val >= best.', 'Recurse with max(best, node.val).', 'Sum the counts.'],
    pitfalls: ['Equal values count as good (>=).', 'The maximum is per path, not global.'],
    invariant: 'best = largest value on the path from the root to the current node\'s parent.',
    time: 'O(n)', space: 'O(h)',
    code: `
def goodNodes(root):
    def dfs(node, best):
        if not node:
            return 0
        good = 1 if node.val >= best else 0       #@check
        best = max(best, node.val)
        return good + dfs(node.left, best) + dfs(node.right, best)
    return dfs(root, root.val)                    #@start`,
    inputs: [{ label: 'Classic', v: { root: [3, 1, 4, 3, null, 1, 5] }, expect: 4 }, { label: 'Mixed', v: { root: [3, 3, null, 4, 2] }, expect: 3 }],
    validate: treeOk(15),
    run({ root: R }, T) {
      const root = buildTree(R), marks = [], tags = [];
      let count = 0;
      T.step('start', 'Walk down carrying the largest value on the path.', tv('tree', root, {}), vars({ count }));
      const go = (n, best) => {
        if (!n) return;
        const good = n.val >= best;
        if (good) count++;
        marks.push([n, good ? 'ok' : 'bad']); tags.push([n, 'max ' + best]);
        T.step('check', good ? `${n.val} ≥ path max ${best}: good. count = ${count}.` : `${n.val} < path max ${best}: not good.`, tv('tree', root, { hl: [...marks.slice(0, -1).map(([x, c]) => [x, c === 'ok' ? 'done' : 'mute']), [n, good ? 'ok' : 'bad']], tags }), vars({ best, count }));
        go(n.left, Math.max(best, n.val)); go(n.right, Math.max(best, n.val));
      };
      go(root, root.val);
      T.step('start', `${count} good node(s).`, tv('tree', root, { hl: marks }), vars({ count }));
      return count;
    },
  });
})();

/* CtCI chapters 1 (Arrays & Strings) and 2 (Linked Lists). Prompts are our own wording. */
(function () {

  const L = (label, nodes, o = {}) => V.ll(label, nodes, { ...o, p: o.p ? ids(o.p) : undefined, hl: o.hl ? Object.fromEntries(o.hl.filter(Boolean).map(([n, c]) => [n.id, c])) : undefined });
  const lenOk = (k, n) => (i) => (i[k].length > n ? `Keep ${k} to ${n} items.` : null);

  /* ---------------- Chapter 1 ---------------- */
  problem({
    id: 'is-unique', n: null, ctci: '1.1', lc: null, title: 'Is Unique', diff: 'Easy', pattern: 'bits',
    prompt: 'Does a lowercase string have all unique characters? Follow-up: use no extra data structures.',
    insight: 'With only 26 letters, one integer can act as 26 yes/no flags. Bit i records whether letter i has been seen.',
    approach: ['seen = 0.', 'For each letter, bit = 1 << (letter index).', 'If seen & bit is set, it repeats; else seen |= bit.'],
    pitfalls: ['A set is the simplest answer; the bit vector is the "no extra structure" follow-up.', 'Sorting and checking neighbours is another O(1)-extra-space option (O(n log n)).', 'A string longer than the alphabet must have a repeat.'],
    invariant: 'Bit i of seen is 1 exactly when letter i appeared before the current position.',
    time: 'O(n)', space: 'O(1)',
    code: `
def isUnique(s):                     # lowercase a-z
    seen = 0                         # bit i = letter i seen   #@init
    for ch in s:
        bit = 1 << (ord(ch) - ord('a'))                        #@bit
        if seen & bit:
            return False                                       #@dup
        seen |= bit                                            #@add
    return True                                                #@ret`,
    inputs: [{ label: 'Repeat', v: { s: 'deadline' }, expect: false }, { label: 'Unique', v: { s: 'blackhorse' }, expect: true }],
    validate: (i) => (!/^[a-z]{0,16}$/.test(i.s) ? 'Use up to 16 lowercase letters.' : null),
    run({ s }, T) {
      let seen = 0;
      const row = (name, val, hl) => ({ name, val, w: 26, hl, show: [...'abcdefghijklmnopqrstuvwxyz'].filter((_, k) => (val >> k) & 1).join('') || '∅' });
      T.step('init', 'Bit 0 is "a", bit 25 is "z". All flags start at 0.', arr('s', s.split('')), bits('flags (rightmost = a)', [row('seen', seen)]));
      for (let i = 0; i < s.length; i++) {
        const k = s.charCodeAt(i) - 97, bit = 1 << k;
        if (seen & bit) { T.step('dup', `'${s[i]}' → bit ${k}, already set. Repeat found.`, arr('s', s.split(''), { p: { i }, hl: { [i]: 'bad', [s.indexOf(s[i])]: 'bad' } }), bits('flags (rightmost = a)', [row('seen', seen, { [k]: 'a' }), row('bit', bit, { [k]: 'a' })])); return false; }
        seen |= bit;
        T.step('add', `'${s[i]}' → bit ${k} is 0. Set it.`, arr('s', s.split(''), { p: { i }, hl: { [i]: 'a' } }), bits('flags (rightmost = a)', [row('seen', seen, { [k]: 'ok' }), row('bit', bit, { [k]: 'a' })]));
      }
      T.step('ret', 'No bit was set twice. All unique.', arr('s', s.split('')), bits('flags (rightmost = a)', [row('seen', seen)]));
      return true;
    },
  });

  problem({
    id: 'urlify', n: null, ctci: '1.3', lc: null, title: 'URLify', diff: 'Easy', pattern: 'two-pointers',
    prompt: 'Replace every space in the first trueLen characters with "%20", in place. The array has enough spare room at the end.',
    insight: 'Writing from the front would overwrite characters you still need. Count spaces, then fill from the back: the write pointer always stays at or ahead of the read pointer.',
    approach: ['Final length = trueLen + 2 × spaces.', 'Read from trueLen − 1 down to 0; write from the final end.', 'A space writes "0", "2", "%"; anything else copies one character.'],
    pitfalls: ['Front-to-back shifting is O(n²).', 'Ignore the padding spaces at the end; only the first trueLen characters count.'],
    invariant: 'Everything after the write index w is already in its final place.',
    time: 'O(n)', space: 'O(1) extra (in place)',
    code: `
def urlify(s, trueLen):
    chars = list(s)
    spaces = chars[:trueLen].count(' ')
    w = trueLen + 2 * spaces - 1          # write index, from the end   #@init
    for r in range(trueLen - 1, -1, -1):
        if chars[r] == ' ':
            chars[w - 2:w + 1] = ['%', '2', '0']      #@space
            w -= 3
        else:
            chars[w] = chars[r]                       #@copy
            w -= 1
    return ''.join(chars[:trueLen + 2 * spaces])      #@ret`,
    inputs: [{ label: 'Mr John Smith', v: { s: 'Mr John Smith    ', trueLen: 13 }, expect: 'Mr%20John%20Smith' }, { label: 'Short', v: { s: 'a b  ', trueLen: 3 }, expect: 'a%20b' }],
    validate: (i) => (i.s.length > 22 ? 'Keep s to 22 characters.' : i.s.slice(0, i.trueLen).split(' ').length - 1 > (i.s.length - i.trueLen) / 2 ? 'Not enough spare room at the end for every %20.' : null),
    run({ s, trueLen }, T) {
      const c = s.split('');
      const spaces = c.slice(0, trueLen).filter((x) => x === ' ').length;
      let w = trueLen + 2 * spaces - 1;
      const v = (o) => arr('chars', c.map((x) => (x === ' ' ? '␣' : x)), o);
      T.step('init', `${spaces} space(s), so the result is ${trueLen + 2 * spaces} long. Write from index ${w} backward.`, v({ p: { r: trueLen - 1, w }, win: [0, trueLen - 1] }), vars({ spaces }));
      for (let r = trueLen - 1; r >= 0; r--) {
        if (c[r] === ' ') {
          c[w - 2] = '%'; c[w - 1] = '2'; c[w] = '0';
          T.step('space', `chars[${r}] is a space: write "%20" into ${w - 2}..${w}.`, v({ p: { r, w }, hl: { [r]: 'b', [w - 2]: 'a', [w - 1]: 'a', [w]: 'a' } }), vars({ spaces }));
          w -= 3;
        } else {
          c[w] = c[r];
          T.step('copy', `Copy '${c[r]}' from ${r} to ${w}.`, v({ p: { r, w }, hl: { [r]: 'b', [w]: 'a' } }), vars({ spaces }));
          w -= 1;
        }
      }
      const res = c.slice(0, trueLen + 2 * spaces).join('');
      T.step('ret', `"${res}".`, v({ hl: Object.fromEntries(c.map((_, k) => [k, k < res.length ? 'ok' : 'mute'])) }));
      return res;
    },
  });

  problem({
    id: 'palindrome-permutation', n: 266, ctci: '1.4', title: 'Palindrome Permutation', diff: 'Easy', pattern: 'hashing',
    prompt: 'Can the letters of a phrase (ignoring case and non-letters) be rearranged into a palindrome?',
    insight: 'A palindrome pairs up every letter, except at most one in the middle. So at most one letter may appear an odd number of times.',
    approach: ['Track letters with an odd count in a set (toggle on each occurrence).', 'Return len(odd) <= 1.'],
    pitfalls: ['You do not need to build the palindrome.', 'A bit vector toggled with XOR works too: check that at most one bit is set (x & (x − 1) == 0).'],
    invariant: 'odd holds exactly the letters seen an odd number of times so far.',
    time: 'O(n)', space: 'O(alphabet)',
    code: `
def canPermutePalindrome(s):
    odd = set()                         # letters with an odd count   #@init
    for ch in s.lower():
        if not ch.isalpha():
            continue
        if ch in odd:
            odd.remove(ch)              #@even
        else:
            odd.add(ch)                 #@odd
    return len(odd) <= 1                #@ret`,
    inputs: [{ label: 'Tact Coa', v: { s: 'Tact Coa' }, expect: true }, { label: 'No', v: { s: 'code' }, expect: false }],
    validate: lenOk('s', 20),
    run({ s }, T) {
      const odd = new Set(), lo = s.toLowerCase();
      T.step('init', 'Toggle each letter in and out of the "odd count" set.', arr('s', chars(s)), set('odd', odd));
      for (let i = 0; i < lo.length; i++) {
        const ch = lo[i];
        if (!/[a-z]/.test(ch)) continue;
        if (odd.has(ch)) { odd.delete(ch); T.step('even', `'${ch}' now has an even count. Remove it.`, arr('s', chars(s), { p: { i }, hl: { [i]: 'ok' } }), set('odd', odd)); }
        else { odd.add(ch); T.step('odd', `'${ch}' now has an odd count. Add it.`, arr('s', chars(s), { p: { i }, hl: { [i]: 'a' } }), set('odd', odd, { hl: ch })); }
      }

  problem({
    id: 'one-away', n: null, ctci: '1.5', lc: null, title: 'One Away', diff: 'Medium', pattern: 'two-pointers',
    prompt: 'Edits are insert, delete or replace one character. Are two strings zero or one edit apart?',
    insight: 'Walk both strings together. On the first mismatch, spend the one edit: if the lengths are equal it is a replace (advance both), otherwise skip a character in the longer string. A second mismatch means more than one edit.',
    approach: ['Length difference > 1 → False.', 'Make a the shorter string.', 'Advance in lockstep; allow one mismatch.'],
    pitfalls: ['Handling insert and delete separately doubles the code; swapping so a is shorter merges them.', 'LeetCode 161 (One Edit Distance) requires exactly one edit, so identical strings are False there.'],
    invariant: 'a[:i] and b[:j] differ by at most one edit, and edited records whether it was used.',
    time: 'O(n)', space: 'O(1)',
    code: `
def oneAway(a, b):
    if abs(len(a) - len(b)) > 1:
        return False                      #@len
    if len(a) > len(b):
        a, b = b, a                       # a is the shorter
    i = j = 0
    edited = False                        #@init
    while i < len(a) and j < len(b):
        if a[i] != b[j]:
            if edited:
                return False              #@second
            edited = True                 #@first
            if len(a) == len(b):
                i += 1                    # replace: move both
        else:
            i += 1                        #@match
        j += 1
    return True                           #@ret`,
    inputs: [{ label: 'Delete', v: { a: 'pale', b: 'ple' }, expect: true }, { label: 'Replace', v: { a: 'pale', b: 'bale' }, expect: true }, { label: 'Two edits', v: { a: 'pale', b: 'bake' }, expect: false }],
    validate: (i) => (i.a.length > 14 || i.b.length > 14 ? 'Keep strings to 14 characters.' : null),
    run({ a, b }, T) {
      if (Math.abs(a.length - b.length) > 1) { T.step('len', 'Lengths differ by more than 1. False.', arr('a', a.split('')), arr('b', b.split(''))); return false; }
      if (a.length > b.length) [a, b] = [b, a];
      let i = 0, j = 0, edited = false;
      const vs = (hl) => [arr('a (shorter)', a.split(''), { p: { i }, hl: hl.a }), arr('b', b.split(''), { p: { j }, hl: hl.b }), vars({ edited: edited ? 'True' : 'False' })];
      T.step('init', a.length === b.length ? 'Same length: only a replace is possible.' : 'b is one longer: only an insert is possible.', ...vs({}));
      while (i < a.length && j < b.length) {
        if (a[i] !== b[j]) {
          if (edited) { T.step('second', `'${a[i]}' ≠ '${b[j]}' and the edit is used up. False.`, ...vs({ a: { [i]: 'bad' }, b: { [j]: 'bad' } })); return false; }
          edited = true;
          T.step('first', `'${a[i]}' ≠ '${b[j]}'. Spend the edit: ${a.length === b.length ? 'replace, move both' : 'skip b[' + j + '] (insert)'}.`, ...vs({ a: { [i]: 'a' }, b: { [j]: 'a' } }));
          if (a.length === b.length) i++;
        } else {
          T.step('match', `'${a[i]}' matches.`, ...vs({ a: { [i]: 'ok' }, b: { [j]: 'ok' } }));
          i++;
        }
        j++;
      }
      T.step('ret', `Done with at most one edit. True.`, ...vs({}));
      return true;
    },
  });

  problem({
    id: 'string-compression-ctci', n: null, ctci: '1.6', lc: null, title: 'String Compression', diff: 'Easy', pattern: 'two-pointers',
    prompt: 'Compress runs of repeated characters: "aabcccccaaa" → "a2b1c5a3". Return the original if compression does not make it shorter.',
    insight: 'Count the current run; when the next character differs (or the string ends), emit the character and its count.',
    approach: ['Walk the string with a running count.', 'At the end of a run, append char + count.', 'Join once at the end; compare lengths.'],
    pitfalls: ['Building with repeated string += is O(n²) in many languages; collect parts and join.', 'LeetCode 443 is a related in-place variant that omits counts of 1.'],
    invariant: 'out holds the compressed form of every finished run.',
    time: 'O(n)', space: 'O(n)',
    code: `
def compress(s):
    out, count = [], 0                        #@init
    for i, ch in enumerate(s):
        count += 1
        if i + 1 == len(s) or s[i + 1] != ch:
            out.append(ch + str(count))       #@emit
            count = 0
    res = ''.join(out)
    return res if len(res) < len(s) else s    #@ret`,
    inputs: [{ label: 'Compresses', v: { s: 'aabcccccaaa' }, expect: 'a2b1c5a3' }, { label: 'No gain', v: { s: 'abca' }, expect: 'abca' }],
    validate: lenOk('s', 20),
    run({ s }, T) {
      const out = []; let count = 0, start = 0;
      T.step('init', 'Scan runs of equal characters.', arr('s', s.split('')), arr('out', out, { noidx: true }));
      for (let i = 0; i < s.length; i++) {
        count++;
        if (i + 1 === s.length || s[i + 1] !== s[i]) {
          out.push(s[i] + count);
          T.step('emit', `Run of '${s[i]}' ends at ${i}: emit "${s[i]}${count}".`, arr('s', s.split(''), { win: [start, i], p: { i } }), arr('out', out, { noidx: true, hl: { [out.length - 1]: 'a' } }));
          count = 0; start = i + 1;
        }
      }
      const res = out.join('');
      const use = res.length < s.length;
      T.step('ret', use ? `"${res}" (${res.length}) is shorter than ${s.length}. Use it.` : `"${res}" (${res.length}) is not shorter. Return the original.`, V.text('result', use ? res : s, { ok: true }));
      return use ? res : s;
    },
  });

  problem({
    id: 'rotate-string', n: 796, ctci: '1.9', title: 'String Rotation', diff: 'Easy', pattern: 'hashing',
    prompt: 'Is s2 a rotation of s1 (e.g. "waterbottle" → "erbottlewat"), using a single substring check?',
    insight: 'Every rotation of s1 appears inside s1 + s1. So s2 is a rotation exactly when the lengths match and s2 is a substring of s1 + s1.',
    approach: ['Lengths must match.', 'Return s2 in s1 + s1.'],
    pitfalls: ['Without the length check, "ab" would count as a rotation of "abc".', 'Trying every rotation separately is O(n²) string building.'],
    invariant: 'Every start position checked so far failed to match s2.',
    time: 'O(n) with a linear-time substring search', space: 'O(n)',
    code: `
def isRotation(s1, s2):
    if len(s1) != len(s2):
        return False                      #@len

class ThreeStacks:

        self.size = size
        self.values = [None] * (3 * size)                     #@init
        self.sizes = [0, 0, 0]
    def push(self, s, value):

def sortStack(s):
    r = []                       # sorted, largest on top     #@init
    while s:
        tmp = s.pop()                                          #@take
        while r and r[-1] > tmp:
            s.append(r.pop())                                  #@back
        r.append(tmp)                                          #@place

        s.append(r.pop())        # smallest ends on top of s   #@final

    for a, b in edges:

    seen, q = {start}, deque([start])       #@init
    while q:

        if u == end:

    code: `
def inorderSuccessor(node):
    if node.right:                      # leftmost of the right subtree
        node = node.right
        while node.left:
            node = node.left            #@down
        return node                     #@right
    while node.parent and node is node.parent.right:
        node = node.parent              #@up
    return node.parent                  #@ret`,
    inputs: [{ label: 'Has right', v: { root: [20, 8, 22, 4, 12, null, null, null, null, 10, 14], node: 8 }, expect: 10 }, { label: 'Climb up', v: { root: [20, 8, 22, 4, 12, null, null, null, null, 10, 14], node: 14 }, expect: 20 }, { label: 'Largest', v: { root: [20, 8, 22, 4, 12], node: 22 }, expect: null }],

      let node = nodesOf(root).find((n) => n.val === target);

        node = node.right;

def pathSum(root, target):
    counts = defaultdict(int)
    counts[0] = 1                                  #@init

        if not node:
            return 0
        running += node.val
        found = counts[running - target]           #@look
        counts[running] += 1

def permuteUnique(nums):
    res, path = [], []

    def bt():

        for x in count:

def solveNQueens(n):
    res, cols = [], []           # cols[r] = column of row r's queen
    def safe(r, c):
        return all(c != cc and abs(c - cc) != r - rr for rr, cc in enumerate(cols))
    def place(r):

            res.append(['.' * c + 'Q' + '.' * (n - c - 1) for c in cols]); return   #@hit
        for c in range(n):

                cols.pop()                        #@undo
    place(0)
    return res`,
    inputs: [{ label: 'n = 4', v: { n: 4 }, expect: [['.Q..', '...Q', 'Q...', '..Q.'], ['..Q.', 'Q...', '...Q', '.Q..']] }, { label: 'n = 5 (first part)', v: { n: 5 } }],
    validate: (i) => (i.n < 1 || i.n > 6 ? 'Use n from 1 to 6.' : null),

        const hl = {};
        cols.forEach((c, r) => (hl[r + ',' + c] = 'b'));

      };
      const safe = (r, c) => cols.every((cc, rr) => c !== cc && Math.abs(c - cc) !== r - rr);

    insight: 'Try every operator as the last one evaluated. Count how many ways each side is True or False, combine by the operator\'s truth table, and memoize each (range, wanted) pair.',
    approach: ['ways(i, j, want): a single digit is 1 or 0 ways.', 'For each operator k between i and j: get True/False counts of both sides.', '& → lt·rt true; | → all but lf·rf; ^ → lt·rf + lf·rt. False = total − true.'],
    pitfalls: ['Without memo, the same sub-expressions are recomputed exponentially.', 'Total ways for a range = (lt + lf) × (rt + rf), which gives the False count for free.'],

from functools import cache
def countEval(s, result):
    @cache
    def ways(i, j, want):                  # s[i..j] evaluates to want
        if i == j:
            return int((s[i] == '1') == want)                   #@leaf
        total = 0
        for k in range(i + 1, j, 2):       # operator at k
            lt, lf = ways(i, k - 1, True), ways(i, k - 1, False)
            rt, rf = ways(k + 1, j, True), ways(k + 1, j, False)
            if s[k] == '&': t = lt * rt
            elif s[k] == '|': t = lt * rt + lt * rf + lf * rt
            else: t = lt * rf + lf * rt
            total += t if want else (lt + lf) * (rt + rf) - t     #@split
        return total
    return ways(0, len(s) - 1, result)                           #@ret`,
    inputs: [{ label: '1^0|0|1 → False', v: { s: '1^0|0|1', result: false }, expect: 2 }, { label: '0&0&0&1^1|0 → True', v: { s: '0&0&0&1^1|0', result: true }, expect: 10 }],

      const memo = new Map(), C = s.split('');
      const key = (i, j, w) => `${i}..${j} ${w ? 'T' : 'F'}`;
      const mv = (h) => map('memo (range want → ways)', Object.fromEntries([...memo].slice(-14)), { hl: h });
      const ways = (i, j, want) => {
        const kk = key(i, j, want);
        if (memo.has(kk)) return memo.get(kk);
        let total = 0;
        if (i === j) { total = (s[i] === '1') === want ? 1 : 0; memo.set(kk, total); return total; }
        for (let k = i + 1; k < j; k += 2) {
          const lt = ways(i, k - 1, true), lf = ways(i, k - 1, false), rt = ways(k + 1, j, true), rf = ways(k + 1, j, false);
          const t = s[k] === '&' ? lt * rt : s[k] === '|' ? lt * rt + lt * rf + lf * rt : lt * rf + lf * rt;
          const add = want ? t : (lt + lf) * (rt + rf) - t;
          total += add;
          T.step('split', `"${s.slice(i, j + 1)}" with '${s[k]}' evaluated last: left True/False ${lt}/${lf}, right ${rt}/${rf} → ${add} way(s) to get ${want ? 'True' : 'False'}.`, arr('expression', C, { win: [i, j], hl: { [k]: 'a', ...Object.fromEntries([...Array(k - i)].map((_, d) => [i + d, 'b'])) } }), mv(), vars({ total }));
        }
        memo.set(kk, total);
        return total;
      };
      const r = ways(0, s.length - 1, result);
      T.step('ret', `${r} parenthesization(s) evaluate to ${result ? 'True' : 'False'}.`, arr('expression', C), mv(key(0, s.length - 1, result)), vars({ answer: r }));
      return r;
    },
  });
})();

(function () {

  problem({
    id: 'merge-sort', n: 912, lc: 'sort-an-array', ctci: 'ch 10', title: 'Merge Sort', diff: 'Medium', pattern: 'recursion',
    prompt: 'Sort an array with merge sort: split in half, sort each half, merge the two sorted halves.',
    insight: 'Merging two sorted lists takes one linear pass (always take the smaller front). Splitting in half gives log n levels, each doing O(n) merge work.',
    approach: ['Base case: 0 or 1 element is sorted.', 'Sort the left and right halves recursively.', 'Merge: repeatedly take the smaller front element.'],
    pitfalls: ['Use <= when merging to keep the sort stable.', 'O(n) extra space; in-place merging is complicated and rarely asked.'],
    invariant: 'After a call returns, its range of the array is sorted.',
    time: 'O(n log n) always', space: 'O(n)',
    code: `
def mergeSort(a):
    if len(a) <= 1:
        return a                                    #@base
    mid = len(a) // 2
    left, right = mergeSort(a[:mid]), mergeSort(a[mid:])   #@split
    out, i, j = [], 0, 0
    while i < len(left) and j < len(right):
        if left[i] <= right[j]:
            out.append(left[i]); i += 1             #@takel
        else:
            out.append(right[j]); j += 1            #@taker
    return out + left[i:] + right[j:]               #@merge`,
    inputs: [{ label: 'Eight', v: { a: [38, 27, 43, 3, 9, 82, 10, 5] }, expect: [3, 5, 9, 10, 27, 38, 43, 82] }],
    validate: (i) => (i.a.length > 10 ? 'Keep to 10 values.' : null),
    maxSteps: 900,
    run({ a }, T) {
      const work = a.slice();
      const sort = (lo, hi) => {
        if (hi - lo < 1) return;
        const mid = lo + ((hi - lo + 1) >> 1);
        T.step('split', `Split ${lo}..${hi} into ${lo}..${mid - 1} and ${mid}..${hi}.`, V.bars('array', work, { hl: { ...out(work.length, lo, hi) } }), arr('array', work, { win: [lo, hi] }));
        sort(lo, mid - 1); sort(mid, hi);
        const L = work.slice(lo, mid), R = work.slice(mid, hi + 1), o = [];
        let i = 0, j = 0;
        while (i < L.length && j < R.length) {
          if (L[i] <= R[j]) { o.push(L[i++]); T.step('takel', `${L[i - 1]} ≤ ${R[j]}: take from the left half.`, arr('left (sorted)', L, { p: { i: Math.min(i, L.length - 1) }, hl: { [i - 1]: 'a' } }), arr('right (sorted)', R, { p: { j } }), arr('merged', o, { hl: { [o.length - 1]: 'a' } })); }
          else { o.push(R[j++]); T.step('taker', `${R[j - 1]} < ${L[i]}: take from the right half.`, arr('left (sorted)', L, { p: { i } }), arr('right (sorted)', R, { p: { j: Math.min(j, R.length - 1) }, hl: { [j - 1]: 'a' } }), arr('merged', o, { hl: { [o.length - 1]: 'a' } })); }
        }
        const merged = [...o, ...L.slice(i), ...R.slice(j)];
        merged.forEach((x, k) => (work[lo + k] = x));

      };

  problem({
    id: 'quick-sort', n: null, lc: 'sort-an-array', ctci: 'ch 10', title: 'Quick Sort', diff: 'Medium', pattern: 'recursion',
    prompt: 'Sort an array in place with quick sort: partition around a pivot, then sort each side.',
    insight: 'Partition moves everything smaller than the pivot to the left and puts the pivot in its final position. Each side is then a smaller, independent problem.',
    approach: ['Pivot = last element; i marks where the next smaller value goes.', 'For each j: if a[j] < pivot, swap it to position i and advance i.', 'Swap the pivot into position i, then recurse on both sides.'],
    pitfalls: ['A sorted input with a last-element pivot gives O(n²); pick a random pivot.', 'Not stable. Many duplicates benefit from three-way partitioning.'],
    invariant: 'During partition: a[lo..i−1] < pivot ≤ a[i..j−1].',
    time: 'O(n log n) average, O(n²) worst', space: 'O(log n) recursion',
    code: `
def quickSort(a, lo=0, hi=None):
    if hi is None:
        hi = len(a) - 1
    if lo >= hi:
        return a                                    #@base
    pivot, i = a[hi], lo                            #@pivot
    for j in range(lo, hi):

def sparseSearch(words, target):
    lo, hi = 0, len(words) - 1
    while lo <= hi:

                    return -1                 #@empty
                if r <= hi and words[r]:

def maxPoints(points):

    for i, (x1, y1) in enumerate(points):

          let dx = points[j][0] - points[i][0], dy = points[j][1] - points[i][1];

def masterMind(solution, guess):

        else:

def patternMatch(pattern, value):
    if not pattern:
        return not value
    main = pattern[0]
    alt = 'b' if main == 'a' else 'a'
    n_main, n_alt = pattern.count(main), pattern.count(alt)
    first_alt = pattern.find(alt)
    for main_len in range(len(value) // n_main + 1):
        rest = len(value) - main_len * n_main
        if n_alt == 0:
            if rest != 0:
                continue
            alt_len = 0
        elif rest % n_alt:
            continue
        else:
            alt_len = rest // n_alt
        main_s = value[:main_len]
        alt_start = first_alt * main_len
        alt_s = value[alt_start:alt_start + alt_len] if n_alt else ''

        if build == value:

    return False                                                           #@none`,

      for (let L = 0; L <= Math.floor(value.length / nM); L++) {

        const ms = value.slice(0, L), as = nA ? value.slice(fa * L, fa * L + A) : '';
        const build = pattern.split('').map((p) => (p === main ? ms : as)).join('');
        const ok = build === value;
        T.step(ok ? 'match' : 'try', `${main} = "${ms}" (length ${L}) forces ${alt} length ${A}: ${alt} = "${as}". Built "${build}"${ok ? ' — matches.' : '.'}`, arr('pattern', pattern.split('')), V.text('value', value), V.text('built', build, { ok }), vars({ [main]: '"' + ms + '"', [alt]: '"' + as + '"' }));

def missingTwo(nums):
    n = len(nums) + 2
    total = n * (n + 1) // 2 - sum(nums)        # = a + b                  #@sum
    pivot = total // 2                          # a <= pivot < b

    return [small, total - small]                                         #@ret`,
    inputs: [{ label: '1..10', v: { nums: [1, 2, 4, 6, 7, 8, 9, 10] }, expect: [3, 5] }, { label: 'Ends', v: { nums: [2, 3, 4, 5, 7] }, expect: [1, 6] }],

def ladderLength(begin, end, wordList):
    words = set(wordList)

            return steps                                 #@found

    run({ begin, end, wordList }, T) {

      const diff1 = (a, b) => a.length === b.length && [...a].filter((c, k) => c !== b[k]).length === 1;
      const edges = []; for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++) if (diff1(all[i], all[j])) edges.push([all[i], all[j]]);

      if (!words.has(end)) { T.step('init', `"${end}" is not in the list. 0.`, gv({})); return 0; }
      const q = [[begin, 1]];
      T.step('init', `BFS from "${begin}".`, gv({ [begin]: 'a' }), arr('queue', q.map(([w]) => w), { noidx: true }));
      while (q.length) {
        const [w, steps] = q.shift();
        if (w === end) { T.step('found', `Reached "${end}" in ${steps} words.`, gv({ [w]: 'ok' }), arr('queue', q.map(([x]) => x), { noidx: true })); return steps; }
        T.step('pop', `Visit "${w}" (${steps} word(s) so far). Try every one-letter change.`, gv({ [w]: 'a' }), arr('queue', q.map(([x]) => x), { noidx: true }));
        for (let i = 0; i < w.length; i++) for (const ch of 'abcdefghijklmnopqrstuvwxyz') {

          if (words.has(nx) && !dist.has(nx)) { dist.set(nx, steps + 1); q.push([nx, steps + 1]); T.step('push', `"${nx}" is a word one letter away. Enqueue it (distance ${steps + 1}).`, gv({ [w]: 'a', [nx]: 'ok' }, { [w + '-' + nx]: 'a' }), arr('queue', q.map(([x]) => x), { noidx: true })); }
        }
      }

      return 0;

def sparseSimilarity(docs):                       # docs: {id: [words]}
    owners = defaultdict(list)
    for d, ws in docs.items():
        for w in set(ws):
            owners[w].append(d)                    #@index
    inter = Counter()
    for w, ds in owners.items():
        for i in range(len(ds)):
            for j in range(i + 1, len(ds)):
                inter[(ds[i], ds[j])] += 1         #@pair
    res = {}
    for (a, b), k in inter.items():

    return res`,

/* ---- quiz.js ---- */
/* Predict-the-next-step questions, generated by diffing consecutive frames.
   The answer always comes from the next frame, so it can't be wrong. */
(function () {
  const { fmt, rng } = TL;
  const key = (v) => v.t + ':' + v.label;
  const isNum = (s) => /^-?\d+(\.\d+)?$/.test(s);
  const short = (s) => (s.length > 40 ? s.slice(0, 38) + '…' : s);

  function options(correct, pool, r) {
    const out = [correct];
    const add = (x) => { x = String(x); if (out.length < 4 && x !== '' && x !== '·' && x !== 'undefined' && !out.includes(x)) out.push(x); };
    pool.forEach(add);
    if (isNum(correct)) { const c = +correct; [c + 1, c - 1, c + 2, c * 2, c - 2, 0, 1].forEach(add); }
    if (out.length < 3) return null;
    for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; }

    const A = new Map(a.views.map((v) => [key(v), v]));

      const u = A.get(key(v));
      if (!u || u.t !== v.t) continue;
      if (v.t === 'arr' && u.data.length === v.data.length) {
        const d = [];
        v.data.forEach((x, i) => { if (fmt(x) !== fmt(u.data[i])) d.push(i); });
        if (d.length === 1) {
          const i = d[0], c = fmt(v.data[i]);

          const n = v.data.length;
          const moved = Object.keys(v.p).filter((k) => k in u.p && v.p[k] !== u.p[k] && v.p[k] != null && u.p[k] != null && v.p[k] >= 0 && v.p[k] < n);

            const k = moved[0], to = v.p[k], from = u.p[k];

            const pool = [from, from + 1, from - 1, to + 1, to - 1, to + 2, from + 2].filter((i) => i >= 0 && i < n && i !== to).map(lab);
            out.push({ w: 3, q: `Where does ${k} point next?`, correct: lab(to), pool });
          }
        }
      } else if (v.t === 'grid' && u.data.length === v.data.length && v.data.length && u.data[0].length === v.data[0].length) {
        const d = [];
        v.data.forEach((row, r) => row.forEach((x, c) => { if (x !== u.data[r][c]) d.push([r, c]); }));
        if (d.length === 1 || d.length === 2) {
          const [r, c] = d[0];
          const where = v.rowLabels && v.colLabels ? `row '${v.rowLabels[r]}', column '${v.colLabels[c]}'` : `cell (${r}, ${c})`;
          const near = [];
          for (const [dr, dc] of [[-1, 0], [0, -1], [-1, -1], [1, 0], [0, 1]]) { const row = v.data[r + dr]; if (row && row[c + dc] !== undefined) near.push(row[c + dc]); }
          out.push({ w: 4, q: `What goes in ${where} of ${v.label}?`, correct: v.data[r][c], pool: [u.data[r][c], ...near] });
        }
      } else if (v.t === 'map') {
        const old = Object.fromEntries(u.entries);
        const d = v.entries.filter(([k, x]) => old[k] !== x);
        if (d.length === 1) {
          const [k, x] = d[0];
          out.push({ w: 3, q: `What will ${v.label.split(' (')[0]}[${k}] be?`, correct: x, pool: [old[k], ...v.entries.map((e) => e[1])].filter((y) => y !== undefined) });
        }

        const vals = {}; const walk = (n) => { if (!n) return; vals[n.id] = n.v; (v.nary ? n.c || [] : [n.l, n.r]).forEach(walk); }; walk(v.root);

  }

  // One question per transition, at most every other step.
  function makeQuestions(p, frames, seed) {
    const r = rng(seed || 11);
    const qs = frames.map(() => null);
    let last = -9;
    const stops = new Set(frames.map((f) => f.line));
    for (let k = 0; k + 1 < frames.length; k++) {
      if (k - last < 2) continue;
      const cs = candidates(frames[k], frames[k + 1], p, stops).sort((x, y) => y.w - x.w);
      for (const c of cs) {
        const opts = options(String(c.correct), c.pool.map(String), r);
        if (opts) { qs[k] = { q: c.q, opts, correct: String(c.correct) }; last = k; break; }
      }
    }
    return qs;
  }

  TL.quiz = { makeQuestions };
})();

    for (const x of others) { const g = GROUP[x.id] || x.id; if (!used.has(g)) { used.add(g); pick.push(x); } if (pick.length === 3) break; }

          <form id="inForm" class="inputs">
            <div id="fields"></div>
            <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn" type="submit">Run trace</button><span class="in-err" id="inErr"></span></div>
          </form>
        </div>
        <div class="card">
          <div class="eyebrow">Common mistakes</div>
          <ul class="steps-list">${(p.pitfalls || []).map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
        </div>
      </div>
      <div class="card">
        <div class="eyebrow" style="margin-bottom:8px">How well could you solve this without help?</div>
        <div class="grade" id="grade">
          ${[['Again', 'g-again', 0], ['Hard', '', 1], ['Good', 'g-good', 2], ['Easy', '', 3]].map(([l, c, g]) => `<button class="${c}" data-g="${g}">${l}<small>${preview(p.id, g).label}</small></button>`).join('')}
          <span class="grade-note" id="gradeNote">${store.cards[p.id] ? 'Next review ' + new Date(store.cards[p.id].due).toLocaleDateString() : 'Not graded yet.'}</span>
        </div>
      </div>
      <nav class="pager">${prev ? `<a href="#${prev.id}"><small>Previous</small>${esc(prev.title)}</a>` : '<span></span>'}${next ? `<a href="#${next.id}" style="text-align:right"><small>Next</small>${esc(next.title)}</a>` : ''}</nav>
    </div>`;

    // wire up
    $('#recallT').addEventListener('change', (e) => { store.recall = e.target.checked; save(); main.querySelectorAll('.hideable').forEach((c) => c.classList.toggle('hidden-ans', store.recall)); });
    main.querySelectorAll('.reveal-btn').forEach((b) => b.addEventListener('click', () => b.parentNode.classList.remove('hidden-ans')));
    $('#clozeT').addEventListener('change', (e) => { store.cloze = e.target.checked; save(); $('#code').classList.toggle('cloze', store.cloze); $('#code').querySelectorAll('.shown').forEach((x) => x.classList.remove('shown')); });
    $('#code').addEventListener('click', (e) => { const ln = e.target.closest('.ln'); if (ln && store.cloze) ln.classList.add('shown'); });
    $('#bFirst').onclick = () => go(0);
    $('#bPrev').onclick = () => go(P.i - 1);
    $('#bNext').onclick = () => step();
    $('#quizT').onchange = (e) => { store.quiz = e.target.checked; save(); if (!store.quiz) { P.asking = null; $('#quiz').hidden = true; } updateQuizNote(); };
    $('#quiz').addEventListener('click', (e) => { const b = e.target.closest('[data-o]'); if (b) answer(+b.dataset.o); if (e.target.closest('#qSkip')) answer(-1); });
    $('#bLast').onclick = () => go(P.frames.length - 1);
    $('#bPlay').onclick = togglePlay;
    $('#scrub').oninput = (e) => { stopPlay(); go(+e.target.value); };
    $('#speed').onchange = (e) => { store.speed = +e.target.value; save(); if (P.timer) { stopPlay(); togglePlay(); } };
    $('#presets').addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (b) loadInput(p.inputs[+b.dataset.i].v, +b.dataset.i); });
    $('#inForm').addEventListener('submit', (e) => { e.preventDefault(); runFromFields(); });
    $('#grade').addEventListener('click', (e) => {
      const b = e.target.closest('[data-g]'); if (!b) return;
      const pv = grade(p.id, +b.dataset.g);
      $('#gradeNote').textContent = `Saved. Next review in ${pv.label}.`;
      main.querySelectorAll('#grade button').forEach((x) => { x.querySelector('small').textContent = preview(p.id, +x.dataset.g).label; });
      buildSide();
    });
    loadInput(p.inputs[0].v, 0);
  }

  function loadInput(v, presetIdx) {
    const f = $('#fields');
    f.innerHTML = Object.entries(v).map(([k, val]) => `<div class="field"><label for="in-${k}">${esc(k)}</label><input id="in-${k}" data-k="${esc(k)}" value="${esc(JSON.stringify(val))}" spellcheck="false" autocomplete="off"></div>`).join('');
    main.querySelectorAll('#presets .chip').forEach((c) => c.setAttribute('aria-pressed', String(+c.dataset.i === presetIdx)));
    run(v);
  }
  function runFromFields() {
    const v = {};
    try {
      main.querySelectorAll('#fields input').forEach((inp) => {
        try { v[inp.dataset.k] = JSON.parse(inp.value); } catch (e) { throw new Error(`${inp.dataset.k} is not valid JSON. Use double quotes for strings, e.g. "abc".`); }
      });
    } catch (e) { $('#inErr').textContent = e.message; return; }
    const shape = P.prob.inputs[0].v;
    for (const k in shape) {
      const want = Array.isArray(shape[k]) ? 'array' : typeof shape[k];
      const got = Array.isArray(v[k]) ? 'array' : typeof v[k];
      if (want !== got) { $('#inErr').textContent = `${k} should be ${want === 'array' ? 'an array' : 'a ' + want}.`; return; }
    }
    const bad = P.prob.validate && P.prob.validate(v);
    if (bad) { $('#inErr').textContent = bad; return; }
    main.querySelectorAll('#presets .chip').forEach((c) => c.setAttribute('aria-pressed', 'false'));
    run(v);
  }
  function run(v) {
    stopPlay();
    $('#inErr').textContent = '';
    P.input = v;
    const r = runProblem(P.prob, v);
    P.frames = r.frames; P.result = r.result; P.error = r.error;
    P.qs = TL.quiz.makeQuestions(P.prob, P.frames, JSON.stringify(v).length * 31 + P.frames.length);
    P.ans = {}; P.right = 0; P.total = 0; P.asking = null; P.fbFor = -1;
    $('#quiz').hidden = true;
    updateQuizNote();
    resetStage($('#stage'));
    $('#scrub').max = Math.max(0, P.frames.length - 1);
    go(0);
  }
  function go(i) {
    if (!P.frames.length) {
      $('#msg').innerHTML = `<span class="err">${esc(P.error || 'No steps.')}</span>`;
      return;
    }
    P.i = Math.max(0, Math.min(P.frames.length - 1, i));
    if (P.asking !== null) P.asking = null;
    if (P.i !== P.fbFor) $('#quiz').hidden = true;
    const f = P.frames[P.i];
    renderFrame($('#stage'), f.views);
    $('#msg').textContent = f.msg;
    $('#curLine').textContent = f.line ? `${f.line}  ${P.prob.parsed.lines[f.line - 1].trim()}` : '';
    $('#stepno').textContent = `${P.i + 1} / ${P.frames.length}`;
    $('#scrub').value = P.i;
    const last = P.i === P.frames.length - 1;
    $('#res').innerHTML = last ? (P.error ? `<span class="err">${esc(P.error)}</span>` : `returns ${esc(fmtResult(P.result))}` + (P.total ? ` · you predicted ${P.right} of ${P.total} steps` : '')) : '';
    const code = $('#code');
    code.querySelectorAll('.ln.cur').forEach((x) => x.classList.remove('cur'));
    const ln = code.children[f.line - 1];
    if (ln) {
      ln.classList.add('cur');
      const top = ln.offsetTop, h = code.clientHeight;
      if (code.scrollHeight > h && (top < code.scrollTop || top > code.scrollTop + h - 30)) code.scrollTop = top - h / 3;
    }
    if (last && P.timer) stopPlay();
  }
  function fmtResult(r) {
    if (P.prob.fmtResult) return P.prob.fmtResult(r);
    if (r === undefined) return 'None';
    if (Array.isArray(r)) return JSON.stringify(r).replace(/null/g, 'None');
    if (r === true) return 'True';
    if (r === false) return 'False';
    if (r === null) return 'None';
    if (typeof r === 'string') return JSON.stringify(r);
    return fmt(r);
  }
  function togglePlay() {
    if (P.timer) return stopPlay();
    if (P.i >= P.frames.length - 1) go(0);
    const ms = 1000 / (+store.speed || 1);
    P.timer = setInterval(() => step(), ms);
    const b = $('#bPlay'); if (b) { b.innerHTML = ICON.pause; b.setAttribute('aria-label', 'Pause'); }
  }
  // Next step, unless a prediction question is waiting on this transition.
  function step() {
    if (P.asking !== null) return;
    const q = store.quiz && P.qs[P.i];
    if (q && !(P.i in P.ans)) { stopPlay(); ask(P.i); return; }
    go(P.i + 1);
  }
  function ask(k) {
    const q = P.qs[k], el = $('#quiz');
    P.asking = k;
    el.hidden = false;
    el.innerHTML = `<div class="q-head"><span class="eyebrow">Predict the next step</span><span class="q-score">${P.right} / ${P.total} right</span></div>
      <p class="q-text">${esc(q.q)}</p>
      <div class="q-opts">${q.opts.map((o, i) => `<button class="q-opt" data-o="${i}"><span class="kbd">${i + 1}</span><span>${esc(o)}</span></button>`).join('')}</div>
      <button class="q-skip" id="qSkip" type="button">Skip question</button>`;
  }
  function answer(oi) {
    const k = P.asking; if (k === null) return;
    const q = P.qs[k], el = $('#quiz');
    P.asking = null;
    if (oi < 0) { P.ans[k] = 'skip'; go(k + 1); return; }
    const ok = q.opts[oi] === q.correct;
    P.ans[k] = ok; P.total++; if (ok) P.right++;
    P.fbFor = k + 1;
    go(k + 1);
    el.hidden = false;
    el.innerHTML = `<div class="q-fb ${ok ? 'ok' : 'bad'}"><b>${ok ? '✓ Right:' : '✗ Not quite. The answer is'}</b> <span class="mono">${esc(q.correct)}</span>${ok ? '' : `<span>(you picked ${esc(q.opts[oi])})</span>`}<span class="q-score">${P.right} / ${P.total} right</span></div>`;
  }
  function updateQuizNote() {
    const t = $('#quizT'); if (!t) return;
    const n = P.qs.filter(Boolean).length;
    t.parentNode.title = n ? `${n} prediction questions in this trace` : 'No questions for this input';
  }
  function stopPlay() {
    if (P.timer) clearInterval(P.timer);
    P.timer = null;
    const b = $('#bPlay'); if (b) { b.innerHTML = ICON.play; b.setAttribute('aria-label', 'Play'); }
  }

  document.addEventListener('keydown', (e) => {
    if (!P.prob || !REG.byId[currentId()]) return;
    if (e.target.closest('input, select, textarea') && e.target.type !== 'checkbox') return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (P.asking !== null && /^[1-4]$/.test(e.key)) { const b = main.querySelector(`[data-o="${+e.key - 1}"]`); if (b) answer(+e.key - 1); e.preventDefault(); return; }
    if (e.key === 'ArrowRight') { stopPlay(); step(); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { stopPlay(); go(P.i - 1); e.preventDefault(); }
    else if (e.key === ' ') { if (e.target.closest('button')) return; togglePlay(); e.preventDefault(); }
    else if (e.key === 'Home') { stopPlay(); go(0); e.preventDefault(); }
    else if (e.key === 'End') { stopPlay(); go(P.frames.length - 1); e.preventDefault(); }
  });

  /* ---------- touch: swipe the stage to step ---------- */
  let sx = null, sy = 0, st = 0;
  main.addEventListener('touchstart', (e) => {
    const stage = e.target.closest('#stage, .caption, .inv');
    if (!stage || e.touches.length !== 1) { sx = null; return; }
    const scroller = e.target.closest('.vbody');
    if (scroller && scroller.scrollWidth > scroller.clientWidth + 4) { sx = null; return; }  // let wide views scroll
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now();
  }, { passive: true });
  main.addEventListener('touchend', (e) => {
    if (sx === null || !P.prob) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    sx = null;
    if (Math.abs(dx) < 45 || Math.abs(dy) > Math.abs(dx) * 0.7 || Date.now() - st > 700) return;
    stopPlay();
    if (dx < 0) step(); else go(P.i - 1);
  }, { passive: true });

  /* ---------- install as an app (Android Chrome) ---------- */
  let installEvt = null;
  const installBtns = ['#install', '#install2'].map((x) => $(x)).filter(Boolean);
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; installBtns.forEach((b) => (b.hidden = false)); });
  installBtns.forEach((b) => b.addEventListener('click', async () => {
    if (!installEvt) return;
    installEvt.prompt();
    try { await installEvt.userChoice; } catch (err) { /* dismissed */ }
    installEvt = null; installBtns.forEach((x) => (x.hidden = true));
  }));
  window.addEventListener('appinstalled', () => installBtns.forEach((x) => (x.hidden = true)));

  route();
})();

</script>

</body>
</html>
