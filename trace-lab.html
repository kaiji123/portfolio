<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Interview Trace Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Step-through visual traces of the core coding interview problems, grouped by pattern.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
/* Layout: sidebar index of patterns | main lab bench (stage left, code right). */
:root {
  --bg: #F2F3EF;
  --panel: #FFFFFF;
  --panel-2: #F8F9F6;
  --ink: #18212C;
  --muted: #5B6672;
  --faint: #8C96A0;
  --line: #D8DCD4;
  --gridline: rgba(24, 33, 44, 0.055);
  --accent: #E9A21A;          /* highlighter: the one thing to watch */
  --accent-soft: #FBEBC4;
  --accent-ink: #1C1405;
  --ok: #2B8A57;
  --ok-soft: #D6EFDF;
  --bad: #C2412D;
  --bad-soft: #F7DAD3;
  --b: #2F6BD8;               /* secondary emphasis / pointer 1 */
  --b-soft: #DCE7FB;
  --p2: #C05A12;              /* pointer 2 */
  --p3: #0E8582;              /* pointer 3 */
  --p4: #8A4FC2;              /* pointer 4 */
  --mute-bg: #ECEEEA;
  --done-bg: #E4E8E2;
  --code-bg: #FBFBF8;
  --shadow: 0 1px 2px rgba(24, 33, 44, .06), 0 4px 14px rgba(24, 33, 44, .05);
  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', 'Cascadia Mono', Consolas, ui-monospace, monospace;
  --cell: 2.6rem;
  --ease: cubic-bezier(.22, .9, .3, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151B; --panel: #181E26; --panel-2: #1D242D; --ink: #E5E9EE; --muted: #9BA6B2; --faint: #6D7884;
    --line: #2A333E; --gridline: rgba(229, 233, 238, 0.045); --accent: #F0B23E; --accent-soft: #4A3812; --accent-ink: #1C1405;
    --ok: #4CC38A; --ok-soft: #173A29; --bad: #F2735F; --bad-soft: #45201A; --b: #77A3FF; --b-soft: #1E2F52;
    --p2: #F39250; --p3: #3CC7C2; --p4: #B992F0; --mute-bg: #1F262F; --done-bg: #232B35; --code-bg: #151A21;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151B; --panel: #181E26; --panel-2: #1D242D; --ink: #E5E9EE; --muted: #9BA6B2; --faint: #6D7884;
  --line: #2A333E; --gridline: rgba(229, 233, 238, 0.045); --accent: #F0B23E; --accent-soft: #4A3812; --accent-ink: #1C1405;
  --ok: #4CC38A; --ok-soft: #173A29; --bad: #F2735F; --bad-soft: #45201A; --b: #77A3FF; --b-soft: #1E2F52;
  --p2: #F39250; --p3: #3CC7C2; --p4: #B992F0; --mute-bg: #1F262F; --done-bg: #232B35; --code-bg: #151A21;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--b); }
:focus-visible { outline: 2px solid var(--b); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; letter-spacing: -0.01em; margin: 0; }
code, .mono, .code, .cell, .v-grid, .svgv text, .kv, .var, .field input { font-variant-ligatures: none; font-feature-settings: "calt" 0, "liga" 0; }
code, .mono { font-family: var(--f-mono); }
.eyebrow { font: 600 11px/1.2 var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: 100%; }
.side {
  position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); overflow: auto;
  border-right: 1px solid var(--line); background: var(--panel); padding: 18px 14px 40px max(14px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand b { font: 700 19px/1 var(--f-display); letter-spacing: -.02em; }
.brand small { display: block; font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.search { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; color: var(--muted);
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.chip .count { opacity: .7; margin-left: 4px; font-variant-numeric: tabular-nums; }
.nav-group { border-top: 1px solid var(--line); padding-top: 6px; }
.nav-group summary {
  list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 6px 4px; font-weight: 600; font-size: 13.5px;
}
.nav-group summary::-webkit-details-marker { display: none; }
.nav-group summary .caret { transition: transform .2s; color: var(--faint); font-size: 10px; width: 10px; }
.nav-group[open] summary .caret { transform: rotate(90deg); }
.nav-group summary .prog { margin-left: auto; font: 500 11.5px var(--f-mono); color: var(--faint); }
.nav-group summary a { color: inherit; text-decoration: none; }
.nav-list { list-style: none; margin: 0 0 6px; padding: 0; }
.nav-item a {
  display: grid; grid-template-columns: 10px 34px 1fr auto; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 6px;
  color: var(--ink); text-decoration: none; font-size: 13.5px;
}
.nav-item a:hover { background: var(--panel-2); }
.nav-item a[aria-current="page"] { background: var(--accent-soft); }
.nav-item .num { font: 11.5px var(--f-mono); color: var(--faint); }
.dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--faint); }
.dot.learning { border-color: var(--accent); background: var(--accent); }
.dot.due { border-color: var(--bad); background: var(--bad); }
.dot.known { border-color: var(--ok); background: var(--ok); }
.diff { font: 600 10.5px var(--f-body); letter-spacing: .04em; padding: 1px 6px; border-radius: 4px; }
.diff.Easy { color: var(--ok); background: var(--ok-soft); }
.diff.Medium { color: var(--p2); background: color-mix(in srgb, var(--p2) 14%, transparent); }
.diff.Hard { color: var(--bad); background: var(--bad-soft); }
.side-foot { margin-top: auto; display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.icon-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 9px; cursor: pointer; font-size: 12.5px; }
.icon-btn:hover { background: var(--panel-2); }
.menu-btn { display: none; }

main { min-width: 0; padding-block: 26px 60px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

/* ---------- home ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: center; }
.hero h1 { font-size: clamp(30px, 4.2vw, 48px); line-height: 1.04; }
.hero p { color: var(--muted); max-width: 60ch; margin: 12px 0 0; }
.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 9px; border: 1px solid var(--ink);
  background: var(--ink); color: var(--panel); font-weight: 600; cursor: pointer; text-decoration: none; font-size: 14px;
}
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn:hover { filter: brightness(1.08); }
.method { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: m; }
.method li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; font-size: 14px; }
.method li::before {
  counter-increment: m; content: counter(m); font: 600 13px var(--f-mono); width: 26px; height: 26px; border-radius: 50%;
  display: grid; place-items: center; border: 1.5px solid var(--ink);
}
.method b { display: block; }
.method span { color: var(--muted); }
.stats { display: flex; gap: 10px; flex-wrap: wrap; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; min-width: 120px; }
.stat b { display: block; font: 700 24px var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; color: var(--muted); }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.pcard {
  display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 12px; color: var(--ink); text-decoration: none; transition: border-color .15s, transform .15s;
}
.pcard:hover { border-color: var(--ink); transform: translateY(-1px); }
.pcard h3 { font-size: 17px; }
.pcard p { margin: 0; font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.pcard .meta { margin-top: auto; display: flex; align-items: center; gap: 8px; font: 12px var(--f-mono); color: var(--faint); }
.bar { flex: 1; height: 4px; background: var(--mute-bg); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); }
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section-h h2 { font-size: 22px; }
.review-list { display: flex; flex-wrap: wrap; gap: 8px; }
.review-list a { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); text-decoration: none; color: var(--ink); font-size: 13.5px; }
.empty { color: var(--muted); font-size: 14px; }

/* ---------- pattern page ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.signals { margin: 8px 0 0; padding-left: 18px; }
.signals li { margin: 3px 0; }
.ptable { width: 100%; border-collapse: collapse; font-size: 14px; }
.ptable td { padding: 9px 8px; border-top: 1px solid var(--line); vertical-align: middle; }
.ptable a { color: var(--ink); font-weight: 600; text-decoration: none; }
.ptable a:hover { text-decoration: underline; }
.ptable .num { font: 12px var(--f-mono); color: var(--faint); width: 54px; }
.ptable .ins { color: var(--muted); font-size: 13px; }

/* ---------- problem page ---------- */
.p-head { display: flex; flex-direction: column; gap: 8px; }
.p-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.p-meta a.pat { color: var(--ink); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; background: var(--panel); }
.p-meta .ext { margin-left: auto; }
.p-head h1 { font-size: clamp(26px, 3vw, 36px); line-height: 1.1; }
.p-head .prompt { margin: 0; max-width: 75ch; font-size: 15.5px; }
.statement { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 10px; box-shadow: var(--shadow); padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.statement .prompt { margin: 0; max-width: 75ch; font-size: 16px; font-weight: 500; }
.statement pre { margin: 0; font: 13px/1.55 var(--f-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.statement .sig { background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; color: var(--b); }
.statement .examples { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.statement .ex { background: var(--panel-2); border-radius: 6px; padding: 8px 10px; min-width: 0; }
.statement .ex-h { font-size: 12.5px; font-weight: 600; margin-bottom: 4px; display: flex; gap: 8px; }
.statement .ex-h span { color: var(--faint); font-weight: 400; }
.statement .ex b { color: var(--muted); font-weight: 600; }
.recall { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.recall .card { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.recall .card p { margin: 0; font-size: 14px; }
.recall ul { margin: 0; padding-left: 18px; font-size: 13.5px; }
.hideable { position: relative; }
.hidden-ans .ans { filter: blur(6px); user-select: none; pointer-events: none; }
.reveal-btn { display: none; }
.hidden-ans .reveal-btn {
  display: block; position: absolute; inset: 22px 0 0; margin: auto; width: max-content; height: max-content;
  padding: 5px 12px; border-radius: 8px; border: 1px solid var(--ink); background: var(--panel); cursor: pointer; font-size: 13px; font-weight: 600; z-index: 2;
}

.bench { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(360px, 1fr); gap: 16px; align-items: start; }
.stage-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; }
.stage {
  position: relative; min-height: 280px; padding: 18px 18px 12px; display: flex; flex-wrap: wrap; gap: 18px 26px; align-content: flex-start;
  background-image: linear-gradient(var(--gridline) 1px, transparent 1px), linear-gradient(90deg, var(--gridline) 1px, transparent 1px);
  background-size: 20px 20px; background-position: -1px -1px;
}
.view { min-width: 0; max-width: 100%; display: flex; flex-direction: column; gap: 6px; }
.view.wide { flex-basis: 100%; }
.view > .vlabel { font: 600 10.5px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.vbody { max-width: 100%; overflow-x: auto; overflow-y: hidden; padding-bottom: 2px; }
.caption {
  border-top: 1px solid var(--line); padding: 12px 18px; display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; background: var(--panel);
  min-height: 66px;
}
.caption .stepno { font: 600 12px var(--f-mono); color: var(--muted); padding-top: 3px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.caption .msg { font-size: 15.5px; line-height: 1.45; }
.caption .result { margin-top: 6px; font: 13px var(--f-mono); color: var(--ok); }
.caption .err { color: var(--bad); font-size: 14px; }
.controls { display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--panel-2); flex-wrap: wrap; }
.ctl {
  width: 36px; height: 34px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer;
}
.ctl:hover { border-color: var(--ink); }
.ctl.play { width: 46px; background: var(--ink); color: var(--panel); border-color: var(--ink); }
.ctl svg { width: 16px; height: 16px; }
.scrub { flex: 1; min-width: 120px; accent-color: var(--accent); }
.speed { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.speed select { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 3px 4px; }
.kbd { font: 11px var(--f-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); }

.code-card { background: var(--code-bg); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; position: sticky; top: 16px; }
.code-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
.code-head .eyebrow { margin: 0; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
.code { margin: 0; padding: 10px 0; overflow-x: auto; font: 12.5px/1.6 var(--f-mono); counter-reset: ln; }
.code .ln { display: block; padding: 0 14px 0 0; white-space: pre; position: relative; transition: background-color .18s; min-width: max-content; }
.code .ln::before {
  counter-increment: ln; content: counter(ln); display: inline-block; width: 34px; padding-right: 12px; text-align: right; color: var(--faint); user-select: none;
}
.code .ln.cur { background: var(--accent-soft); }
.code .ln.cur::before { color: var(--ink); font-weight: 700; }
.code .ln.cur::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); }
.code.cloze .ln:not(.shown) .tx { filter: blur(5px); cursor: pointer; }
.tk-k { color: var(--b); font-weight: 600; }
.tk-s { color: var(--ok); }
.tk-n { color: var(--p2); }
.tk-c { color: var(--faint); font-style: italic; }
.tk-f { color: var(--p4); }
.cx { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); background: var(--panel); }
.cx div { padding: 10px 14px; }
.cx div + div { border-left: 1px solid var(--line); }
.cx b { display: block; font: 600 15px var(--f-mono); }

.lower { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.inputs { display: flex; flex-direction: column; gap: 10px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.field { display: grid; grid-template-columns: 80px 1fr; gap: 8px; align-items: center; }
.field label { font: 12.5px var(--f-mono); color: var(--muted); }
.field input { width: 100%; border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px; padding: 6px 9px; font: 13px var(--f-mono); }
.in-err { color: var(--bad); font-size: 13px; min-height: 1em; }
.steps-list { margin: 8px 0 0; padding-left: 20px; }
.steps-list li { margin: 4px 0; }
.grade { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.grade button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-weight: 600; font-size: 13.5px; }
.grade button small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
.grade button:hover { border-color: var(--ink); }
.grade .g-again { color: var(--bad); }
.grade .g-good { color: var(--ok); }
.grade-note { font-size: 13px; color: var(--muted); }
.pager { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.pager a { text-decoration: none; color: var(--ink); border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 14px; font-size: 14px; max-width: 48%; }
.pager a small { display: block; color: var(--muted); font-size: 11.5px; }

/* ---------- views ---------- */
.v-arr { position: relative; display: inline-flex; flex-direction: column; padding-bottom: 4px; }
.cells { display: flex; gap: 4px; position: relative; z-index: 1; }
.cellwrap { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.cell {
  min-width: var(--cell); height: var(--cell); padding: 0 6px; display: grid; place-items: center; border: 1.5px solid var(--line); border-radius: 7px;
  background: var(--panel); font: 600 14px var(--f-mono); white-space: nowrap; transition: background-color .25s var(--ease), border-color .25s, color .25s, transform .25s var(--ease);
}
.idx { font: 10.5px var(--f-mono); color: var(--faint); }
.cell.a { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); transform: translateY(-2px); }
.cell.b { background: var(--b-soft); border-color: var(--b); }
.cell.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.cell.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.cell.done { background: var(--done-bg); }
.cell.mute { opacity: .38; }
.cell.empty { border-style: dashed; color: var(--faint); }
.win { position: absolute; top: -5px; height: calc(var(--cell) + 10px); border-radius: 10px; background: color-mix(in srgb, var(--b) 12%, transparent); border: 1.5px dashed var(--b); transition: left .3s var(--ease), width .3s var(--ease); z-index: 0; }
.ptrs { position: relative; height: 18px; }
.ptr {
  position: absolute; top: 0; transform: translateX(-50%); font: 700 11.5px/1 var(--f-mono); padding: 3px 5px 2px; border-radius: 4px; color: #fff; white-space: nowrap;
  transition: left .3s var(--ease), top .3s var(--ease);
}
.ptr::before { content: ''; position: absolute; left: 50%; top: -4px; margin-left: -4px; border: 4px solid transparent; border-top: 0; border-bottom-color: inherit; }
.ptr.c0 { background: var(--b); border-color: var(--b); }

/* ---- core.js ---- */
/* Trace Lab core: registry, tracer and view builders. No DOM here, so the

(function (G) {
  const REG = { patterns: [], problems: [], byId: {}, patternById: {} };

  function pattern(def) {
    def.problems = [];
    REG.patterns.push(def);
    REG.patternById[def.id] = def;
  }

  // Code lines can end with "#@label". The label is stripped for display and
  // lets a trace step point at a line by name instead of by number.
  function parseCode(src) {
    const lines = src.replace(/^\n+|\s+$/g, '').split('\n');
    const labels = {};
    const out = lines.map((ln, i) => {
      const m = ln.match(/\s*#@([\w-]+)\s*$/);
      if (m) {
        labels[m[1]] = i + 1;
        ln = ln.slice(0, m.index);
      }
      return ln;

    return { lines: out, labels };
  }

  function problem(def) {
    const pat = REG.patternById[def.pattern];
    if (!pat) throw new Error('Unknown pattern ' + def.pattern + ' in ' + def.id);
    def.parsed = parseCode(def.code);
    REG.problems.push(def);
    REG.byId[def.id] = def;
    pat.problems.push(def);

    ? structuredClone

  class TooManySteps extends Error {}

  function makeTracer(p, maxSteps) {
    const frames = [];

    return {
      frames,
      // step(lineLabel, message, ...views)
      step(line, msg, ...views) {
        if (frames.length >= max) throw new TooManySteps('Trace stopped after ' + max + ' steps. Try a smaller input.');
        let ln = 0;
        if (typeof line === 'number') ln = line;
        else if (line) {
          ln = p.parsed.labels[line];
          if (!ln) throw new Error('Unknown code label "' + line + '" in ' + p.id);
        }
        frames.push({ line: ln, msg, views: clone(views.flat().filter(Boolean)) });
      },
    };
  }

  function runProblem(p, input) {
    const T = makeTracer(p, p.maxSteps);
    let result, error = null;
    try {
      result = p.run(clone(input), T);
    } catch (e) {

def longestConsecutive(nums):
    s = set(nums)                    #@set
    best = 0
    for x in s:                      #@loop
        if x - 1 in s:               #@skip

        length = 1                   #@start
        while x + length in s:       #@grow
            length += 1

    },
  });

    insight: 'Compare from both ends and walk inward, skipping characters that do not count. No need to build a cleaned copy.',
    approach: ['l at the start, r at the end.', 'Skip non-alphanumeric characters on either side.', 'Compare lowercase letters; a mismatch means False.'],
    pitfalls: ['Building a cleaned reversed string is O(n) extra space.', 'Stop when l >= r, not l > r.'],
    time: 'O(n)', space: 'O(1)',
    code: `
def isPalindrome(s):
    l, r = 0, len(s) - 1                    #@init
    while l < r:                            #@loop
        if not s[l].isalnum():              #@skipl
            l += 1
        elif not s[r].isalnum():            #@skipr
            r -= 1
        elif s[l].lower() != s[r].lower():  #@cmp
            return False                    #@no
        else:
            l, r = l + 1, r - 1             #@move
    return True                             #@yes`,
    inputs: [{ label: 'Palindrome', v: { s: 'Race a car? No: race, car!' }, expect: false }, { label: 'Panama', v: { s: 'A man, a plan, Panama' }, expect: false }, { label: 'True case', v: { s: 'Was it a cat I saw?' }, expect: true }],
    validate: (i) => (i.s.length > 26 ? 'Keep s to 26 characters.' : null),
    run({ s }, T) {
      const C = s.split('').map((c) => (c === ' ' ? '␣' : c));
      const al = (c) => /[a-z0-9]/i.test(c);
      const mute = () => { const h = {}; s.split('').forEach((c, i) => { if (!al(c)) h[i] = 'mute'; }); return h; };
      let l = 0, r = s.length - 1;
      T.step('init', 'Put l at the start and r at the end. Grey characters do not count.', arr('s', C, { p: { l, r }, hl: mute() }));
      while (l < r) {
        if (!al(s[l])) { T.step('skipl', `'${C[l]}' is not a letter or digit. Move l right.`, arr('s', C, { p: { l, r }, hl: { ...mute(), [l]: 'b' } })); l++; continue; }
        if (!al(s[r])) { T.step('skipr', `'${C[r]}' is not a letter or digit. Move r left.`, arr('s', C, { p: { l, r }, hl: { ...mute(), [r]: 'b' } })); r--; continue; }
        if (s[l].toLowerCase() !== s[r].toLowerCase()) {
          T.step('no', `'${s[l]}' ≠ '${s[r]}'. Not a palindrome.`, arr('s', C, { p: { l, r }, hl: { ...mute(), [l]: 'bad', [r]: 'bad' } }));
          return false;
        }
        T.step('move', `'${s[l]}' matches '${s[r]}'. Move both inward.`, arr('s', C, { p: { l, r }, hl: { ...mute(), [l]: 'a', [r]: 'a' } }));
        l++; r--;

      T.step('yes', 'The pointers met with no mismatch. Palindrome.', arr('s', C, { p: { l, r }, hl: mute() }));
      return true;
    },

def threeSum(nums):
    nums.sort()                                     #@sort
    res = []
    for i in range(len(nums) - 2):                  #@loop
        if i > 0 and nums[i] == nums[i - 1]:        #@dupi
            continue
        l, r = i + 1, len(nums) - 1                 #@lr
        while l < r:                                #@while

            elif s > 0:

                res.append([nums[i], nums[l], nums[r]])  #@hit
                l += 1
                while l < r and nums[l] == nums[l - 1]:  #@dupl
                    l += 1
    return res                                      #@ret`,

        else { T.step('mover', `Right line (${height[r]}) is not taller. Move r.`, bars('height', height, { p: { l, r }, hl: { [r]: 'mute', [l]: 'b' } }), vars({ area, best })); r--; }

  problem({
    id: 'trapping-rain-water', n: 42, title: 'Trapping Rain Water', diff: 'Hard', pattern: 'two-pointers', blind: false,
    prompt: 'Given bar heights, how much rain water is trapped between them?',
    insight: 'Water above a bar = min(tallest on its left, tallest on its right) − its height. Whichever side has the smaller max is already decided, so process that side.',
    approach: ['Track lmax and rmax from both ends.', 'If lmax < rmax, the left bar\'s water is lmax − height[l]. Advance l.', 'Otherwise do the same from the right.'],
    pitfalls: ['Prefix-max arrays work too but use O(n) space.', 'Update the max before adding water, so a new tall bar adds 0.'],
    time: 'O(n)', space: 'O(1)',
    code: `

    l, r = 0, len(height) - 1               #@init
    lmax, rmax = height[l], height[r]
    water = 0

            l += 1
            lmax = max(lmax, height[l])
            water += lmax - height[l]       #@ladd

    inputs: [{ label: 'Classic', v: { height: [0, 1, 0, 2, 1, 0, 1, 3, 2, 1, 2, 1] }, expect: 6 }, { label: 'Bowl', v: { height: [4, 2, 0, 3, 2, 5] }, expect: 9 }],
    validate: (i) => (i.height.length > 16 || i.height.length < 2 ? 'Use 2 to 16 bars.' : null),
    run({ height }, T) {
      const w = height.map(() => 0);
      let l = 0, r = height.length - 1, lmax = height[l], rmax = height[r], water = 0;
      T.step('init', 'Pointers at both ends. Their heights are the first maxima.', bars('height', height, { p: { l, r }, water: w }), vars({ lmax, rmax, water }));

          r--; rmax = Math.max(rmax, height[r]); w[r] = rmax - height[r]; water += w[r];

        }
      }
      T.step('ret', `Total trapped water: ${water}.`, bars('height', height, { water: w }), vars({ water }));
      return water;
    },
  });
})();

def characterReplacement(s, k):

    id: 'minimum-window-substring', n: 76, title: 'Minimum Window Substring', diff: 'Hard', pattern: 'sliding-window', blind: true,

    code: `
def minWindow(s, t):
    need = Counter(t)                       #@need

          dq.shift();
        }

          res.push(nums[dq[0]]);

        }
      }
      return res;
    },
  });
})();

(function () {
  const { problem, V } = TL;
  const { arr, stack, map, vars, bars } = V;

  problem({
    id: 'valid-parentheses', n: 20, title: 'Valid Parentheses', diff: 'Easy', pattern: 'stack', blind: true,
    prompt: 'Is the bracket string s correctly opened and closed, with matching types and order?',
    insight: 'The most recently opened bracket must close first, which is exactly what a stack gives you.',
    approach: ['Push every opening bracket.', 'On a closing bracket, the top must be its partner; pop it.', 'At the end the stack must be empty.'],
    pitfalls: ['Popping from an empty stack: check first.', 'Leftover openers like "((" must return False.'],
    time: 'O(n)', space: 'O(n)',
    code: `
def isValid(s):
    pairs = {')': '(', ']': '[', '}': '{'}   #@init
    stack = []
    for ch in s:                              #@loop
        if ch in pairs:
            if not stack or stack[-1] != pairs[ch]:
                return False                  #@bad
            stack.pop()                       #@pop
        else:
            stack.append(ch)                  #@push
    return not stack                          #@ret`,
    inputs: [{ label: 'Nested', v: { s: '{[()()]}' }, expect: true }, { label: 'Crossed', v: { s: '([)]' }, expect: false }, { label: 'Leftover', v: { s: '(()' }, expect: false }],
    validate: (i) => (i.s.length > 20 ? 'Keep s to 20 characters.' : null),
    run({ s }, T) {
      const C = s.split(''), st = [], pairs = { ')': '(', ']': '[', '}': '{' };
      T.step('init', 'Each closer maps to the opener it needs.', arr('s', C), stack('stack', st));
      for (let i = 0; i < s.length; i++) {
        const ch = s[i];
        if (pairs[ch]) {
          if (!st.length || st[st.length - 1] !== pairs[ch]) {
            T.step('bad', !st.length ? `'${ch}' has nothing to close. Invalid.` : `'${ch}' needs '${pairs[ch]}' on top, but the top is '${st[st.length - 1]}'. Invalid.`, arr('s', C, { p: { i }, hl: { [i]: 'bad' } }), stack('stack', st, { hl: { [st.length - 1]: 'bad' } }));
            return false;
          }
          T.step('pop', `'${ch}' closes the '${pairs[ch]}' on top. Pop.`, arr('s', C, { p: { i }, hl: { [i]: 'ok' } }), stack('stack', st, { hl: { [st.length - 1]: 'ok' } }));
          st.pop();
        } else {
          st.push(ch);
          T.step('push', `'${ch}' opens. Push it.`, arr('s', C, { p: { i }, hl: { [i]: 'a' } }), stack('stack', st, { hl: { [st.length - 1]: 'a' } }));
        }
      }
      T.step('ret', st.length ? `${st.length} opener(s) never closed. Invalid.` : 'Stack is empty. Valid.', arr('s', C), stack('stack', st, { hl: Object.fromEntries(st.map((_, k) => [k, 'bad'])) }));
      return !st.length;
    },
  });

  problem({
    id: 'daily-temperatures', n: 739, title: 'Daily Temperatures', diff: 'Medium', pattern: 'stack', blind: false,
    prompt: 'For each day, how many days until a warmer temperature? Use 0 if none.',
    insight: 'Keep a stack of days still waiting for a warmer day; their temperatures are decreasing. A warm day pops every colder day it answers.',
    approach: ['Stack holds indices with decreasing temperatures.', 'While today is warmer than the top: pop j, answer[j] = i − j.', 'Push today.'],
    pitfalls: ['Store indices, not temperatures, so you can compute the distance.', 'Each index is pushed and popped once, so the while loop is O(n) overall.'],
    time: 'O(n)', space: 'O(n)',
    code: `
def dailyTemperatures(temps):
    res = [0] * len(temps)                    #@init
    stack = []          # waiting days, colder on top
    for i, t in enumerate(temps):             #@loop
        while stack and temps[stack[-1]] < t:
            j = stack.pop()
            res[j] = i - j                    #@pop
        stack.append(i)                       #@push
    return res                                #@ret`,
    inputs: [{ label: 'Classic', v: { temps: [73, 74, 75, 71, 69, 72, 76, 73] }, expect: [1, 1, 4, 2, 1, 1, 0, 0] }, { label: 'Rising', v: { temps: [30, 40, 50, 60] }, expect: [1, 1, 1, 0] }],
    validate: (i) => (i.temps.length > 14 ? 'Keep to 14 days.' : null),
    run({ temps }, T) {

        const t = temps[i];
        while (st.length && temps[st[st.length - 1]] < t) {
          const j = st.pop(); res[j] = i - j;

    prompt: 'Given bar heights of width 1, return the area of the largest rectangle in the histogram.',
    insight: 'Keep bars on a stack in increasing height. When a shorter bar arrives, every taller bar on the stack has found its right edge, so pop it and measure its rectangle. Its left edge is where it started.',
    approach: ['Stack holds (start index, height), heights increasing.', 'A shorter bar pops taller ones: area = height × (i − start).', 'The new bar extends left to the start of the last popped bar.', 'Append a 0 so everything gets popped at the end.'],

def largestRectangleArea(heights):

      for (let i = 0; i < H.length; i++) {
        const h = H[i]; let start = i;

      }
      T.step('ret', `Largest area ${best}.`, bars('heights + [0]', H, {}), vars({ best }));
      return best;
    },
  });
})();

(function () {
  const { problem, V, buildList, listToArr, ListNode } = TL;
  const { vars, heap: heapV } = V;
  // Pointer maps hold node objects; the view needs ids.
  const ids = (p) => { const o = {}; for (const k in p) o[k] = p[k] ? p[k].id : null; return o; };
  const L = (label, nodes, o = {}) => V.ll(label, nodes, { ...o, p: o.p ? ids(o.p) : undefined, hl: o.hl ? Object.fromEntries(o.hl.filter(Boolean).map(([n, c]) => [n.id, c])) : undefined });
  const lenOk = (k, n) => (i) => (i[k].length > n ? `Keep ${k} to ${n} nodes.` : null);

  problem({
    id: 'reverse-linked-list', n: 206, title: 'Reverse Linked List', diff: 'Easy', pattern: 'linked-list', blind: true,
    prompt: 'Reverse a singly linked list and return the new head.',
    insight: 'Walk the list once and flip each arrow to point backward. Save cur.next first, or you lose the rest of the list.',
    approach: ['prev = None, cur = head.', 'nxt = cur.next; cur.next = prev.', 'Advance prev and cur; prev is the new head at the end.'],
    pitfalls: ['Overwriting cur.next before saving it loses the rest of the list.', 'The recursive version is O(n) stack space.'],
    time: 'O(n)', space: 'O(1)',
    code: `
def reverseList(head):
    prev, cur = None, head          #@init
    while cur:                       #@loop
        nxt = cur.next               #@save
        cur.next = prev              #@flip
        prev, cur = cur, nxt         #@move
    return prev                      #@ret`,
    inputs: [{ label: 'Five nodes', v: { head: [1, 2, 3, 4, 5] }, expect: [5, 4, 3, 2, 1] }, { label: 'Two nodes', v: { head: [1, 2] }, expect: [2, 1] }],
    validate: lenOk('head', 9),
    run({ head }, T) {
      const nodes = buildList(head);
      let prev = null, cur = nodes[0] || null;
      T.step('init', 'prev starts at None; cur starts at the head.', L('list', nodes, { p: { prev, cur } }));
      while (cur) {
        const nxt = cur.next;
        T.step('save', `Save nxt = ${nxt ? nxt.val : 'None'} so the rest of the list is not lost.`, L('list', nodes, { p: { prev, cur, nxt }, hl: [[cur, 'a']] }));
        cur.next = prev;
        T.step('flip', `Flip ${cur.val}'s arrow to point at ${prev ? prev.val : 'None'}.`, L('list', nodes, { p: { prev, cur, nxt }, hl: [[cur, 'a']], ehl: { [cur.id]: 'a' } }));
        prev = cur; cur = nxt;
        T.step('move', 'Step both pointers forward.', L('list', nodes, { p: { prev, cur }, hl: [[prev, 'done']] }));
      }
      T.step('ret', `cur is None. prev (${prev ? prev.val : 'None'}) is the new head.`, L('list', nodes, { p: { head: prev }, hl: [[prev, 'ok']] }));
      return listToArr(prev);
    },
  });

  problem({
    id: 'merge-two-sorted-lists', n: 21, title: 'Merge Two Sorted Lists', diff: 'Easy', pattern: 'linked-list', blind: true,
    prompt: 'Merge two sorted linked lists into one sorted list by splicing their nodes.',
    insight: 'A dummy head means you never special-case the first node. Repeatedly attach the smaller front node to the tail.',
    approach: ['dummy = tail = new node.', 'Attach the smaller of a and b to tail; advance that list.', 'When one runs out, attach the rest of the other.'],
    pitfalls: ['Forgetting to attach the leftover list.', 'Use <= to keep the merge stable.'],
    time: 'O(n + m)', space: 'O(1)',
    code: `
def mergeTwoLists(a, b):
    dummy = tail = ListNode()        #@init
    while a and b:                   #@loop
        if a.val <= b.val:
            tail.next, a = a, a.next #@takea
        else:
            tail.next, b = b, b.next #@takeb
        tail = tail.next             #@tail
    tail.next = a or b               #@rest
    return dummy.next                #@ret`,
    inputs: [{ label: 'Classic', v: { a: [1, 2, 4], b: [1, 3, 4] }, expect: [1, 1, 2, 3, 4, 4] }, { label: 'Uneven', v: { a: [2, 6], b: [1, 3, 5, 7, 9] }, expect: [1, 2, 3, 5, 6, 7, 9] }],
    validate: (i) => (i.a.length + i.b.length > 12 ? 'Keep the two lists to 12 nodes in total.' : null),
    run({ a: A, b: B }, T) {
      const na = buildList(A), nb = buildList(B), dummy = ListNode('D');
      const all = [dummy, ...na, ...nb];
      const pos = {};
      pos[dummy.id] = [0, 1];
      na.forEach((n, i) => (pos[n.id] = [i + 1, 0]));
      nb.forEach((n, i) => (pos[n.id] = [i + 1, 2]));
      let a = na[0] || null, b = nb[0] || null, tail = dummy, k = 0;
      const view = (o) => L('a (top) · merged (middle) · b (bottom)', all, { pos: { ...pos }, nulls: false, ...o });
      T.step('init', 'Dummy node D sits in the merged row. tail marks its end.', view({ p: { a, b, tail } }));
      while (a && b) {
        const takeA = a.val <= b.val, n = takeA ? a : b;
        tail.next = n;
        if (takeA) a = a.next; else b = b.next;
        pos[n.id] = [++k, 1];
        T.step(takeA ? 'takea' : 'takeb', `${takeA ? 'a' : 'b'} has the smaller front (${n.val}). Attach it to tail.`, view({ p: { a, b, tail }, hl: [[n, 'a']] }));
        tail = tail.next;
        T.step('tail', `Advance tail to ${tail.val}.`, view({ p: { a, b, tail }, hl: [[tail, 'done']] }));
      }
      const rest = a || b;
      tail.next = rest;
      let c = rest; while (c) { pos[c.id] = [++k, 1]; c = c.next; }

    },

  problem({
    id: 'reorder-list', n: 143, title: 'Reorder List', diff: 'Medium', pattern: 'linked-list', blind: true,
    prompt: 'Reorder L0 → L1 → … → Ln into L0 → Ln → L1 → Ln−1 → … in place.',
    insight: 'It is three easy problems in a row: find the middle (slow/fast), reverse the second half, then interleave the two halves.',
    approach: ['slow/fast pointers stop slow at the end of the first half.', 'Cut there and reverse the second half.', 'Alternate nodes from the first half and the reversed second half.'],
    pitfalls: ['Forgetting slow.next = None leaves a cycle.', 'Start fast at head.next so slow ends at the first half\'s last node.'],
    time: 'O(n)', space: 'O(1)',
    code: `
def reorderList(head):
    slow, fast = head, head.next              #@init
    while fast and fast.next:                 #@mid
        slow, fast = slow.next, fast.next.next
    second = slow.next                        #@split
    slow.next = None
    prev = None
    while second:                             #@rev
        second.next, prev, second = prev, second, second.next
    first, second = head, prev                #@merge0
    while second:                             #@merge
        t1, t2 = first.next, second.next
        first.next = second
        second.next = t1
        first, second = t1, t2`,
    inputs: [{ label: 'Five nodes', v: { head: [1, 2, 3, 4, 5] }, expect: [1, 5, 2, 4, 3] }, { label: 'Six nodes', v: { head: [1, 2, 3, 4, 5, 6] }, expect: [1, 6, 2, 5, 3, 4] }],
    validate: (i) => (i.head.length > 9 || i.head.length < 2 ? 'Use 2 to 9 nodes.' : null),
    run({ head: H }, T) {
      const nodes = buildList(H), head = nodes[0];
      const pos = {}; nodes.forEach((n, i) => (pos[n.id] = [i, 0]));
      const view = (o) => L('list', nodes, { pos: { ...pos }, ...o });
      let slow = head, fast = head.next;
      T.step('init', 'Phase 1: slow moves 1 step, fast moves 2.', view({ p: { slow, fast } }));
      while (fast && fast.next) {
        slow = slow.next; fast = fast.next.next;
        T.step('mid', `slow → ${slow.val}, fast → ${fast ? fast.val : 'None'}.`, view({ p: { slow, fast }, hl: [[slow, 'a']] }));
      }
      let second = slow.next; slow.next = null;
      const half2 = []; for (let c = second; c; c = c.next) half2.push(c);
      half2.forEach((n) => (pos[n.id] = [pos[n.id][0], 1.2]));
      T.step('split', `Cut after ${slow.val}. The second half drops to its own row.`, view({ p: { slow, second }, hl: [[slow, 'b']] }));
      let prev = null;
      while (second) {
        const nx = second.next; second.next = prev; prev = second; second = nx;
        T.step('rev', `Phase 2: reverse the second half. ${prev.val} now points to ${prev.next ? prev.next.val : 'None'}.`, view({ p: { prev, second }, hl: [[prev, 'a']] }));
      }
      let first = head; second = prev;
      T.step('merge0', 'Phase 3: weave one node from each half.', view({ p: { first, second } }));
      let k = 0;
      const placed = new Set();
      const place = (n) => { if (n && !placed.has(n)) { placed.add(n); pos[n.id] = [k++, 2.4]; } };
      while (second) {
        const t1 = first.next, t2 = second.next;
        first.next = second; second.next = t1;
        place(first); place(second);
        T.step('merge', `Link ${first.val} → ${second.val} → ${t1 ? t1.val : 'None'}.`, view({ p: { first: t1, second: t2 }, hl: [[first, 'done'], [second, 'a']] }));
        first = t1; second = t2;
      }
      for (let c = head; c; c = c.next) place(c);

    pitfalls: ['Without the dummy, deleting the head is a special case.', 'Off-by-one: the gap must be n + 1 so slow stops before the target.'],

def removeNthFromEnd(head, n):
    dummy = ListNode(0, head)        #@init
    fast = slow = dummy
    for _ in range(n + 1):           #@gap
        fast = fast.next
    while fast:                      #@move

    inputs: [{ label: 'n = 2', v: { head: [1, 2, 3, 4, 5], n: 2 }, expect: [1, 2, 3, 5] }, { label: 'Remove head', v: { head: [1, 2, 3], n: 3 }, expect: [2, 3] }],

  problem({
    id: 'linked-list-cycle', n: 141, title: 'Linked List Cycle', diff: 'Easy', pattern: 'linked-list', blind: true,
    prompt: 'Does the linked list contain a cycle? (pos is the index the tail links back to, −1 for none.)',
    insight: 'Floyd\'s tortoise and hare: fast moves 2, slow moves 1. Inside a cycle the gap shrinks by 1 each step, so they must meet.',
    approach: ['slow = fast = head.', 'Move slow 1 and fast 2 each step.', 'If they meet there is a cycle; if fast reaches None there is not.'],
    pitfalls: ['A visited set works but costs O(n) space.', 'Check fast and fast.next before jumping 2.'],
    time: 'O(n)', space: 'O(1)',
    code: `
def hasCycle(head):
    slow = fast = head               #@init
    while fast and fast.next:        #@loop
        slow = slow.next
        fast = fast.next.next        #@move
        if slow is fast:
            return True              #@meet
    return False                     #@none`,
    inputs: [{ label: 'Cycle', v: { vals: [3, 2, 0, -4, 7, 9], pos: 1 }, expect: true }, { label: 'No cycle', v: { vals: [1, 2, 3, 4], pos: -1 }, expect: false }],
    validate: (i) => (i.vals.length > 9 ? 'Keep to 9 nodes.' : i.pos >= i.vals.length ? 'pos must be −1 or a valid index.' : null),
    run({ vals, pos }, T) {
      const nodes = buildList(vals);
      if (pos >= 0 && nodes.length) nodes[nodes.length - 1].next = nodes[pos];
      let slow = nodes[0] || null, fast = nodes[0] || null;
      T.step('init', pos >= 0 ? `The tail links back to index ${pos}.` : 'The tail points to None.', L('list', nodes, { p: { slow, fast } }));
      while (fast && fast.next) {
        slow = slow.next; fast = fast.next.next;
        if (slow === fast) { T.step('meet', `slow and fast meet at ${slow.val}. There is a cycle.`, L('list', nodes, { p: { slow, fast }, hl: [[slow, 'ok']] })); return true; }
        T.step('move', `slow → ${slow.val}, fast → ${fast ? fast.val : 'None'}.`, L('list', nodes, { p: { slow, fast }, hl: [[slow, 'b'], fast ? [fast, 'a'] : null] }));

    },
  });

  problem({
    id: 'merge-k-sorted-lists', n: 23, title: 'Merge k Sorted Lists', diff: 'Hard', pattern: 'linked-list', blind: true,
    prompt: 'Merge k sorted linked lists into one sorted list.',
    insight: 'The next node of the output is the smallest of the k current heads. A min-heap of size k gives that in O(log k).',
    approach: ['Push each list\'s head into a min-heap (value, list index, node).', 'Pop the smallest, append it, push its successor.', 'Repeat until the heap is empty.'],
    pitfalls: ['Include the list index in the tuple so Python never compares two nodes.', 'Merging lists one by one is O(k·N); pairwise divide and conquer also gives O(N log k).'],
    time: 'O(N log k)', space: 'O(k)',
    code: `
def mergeKLists(lists):
    heap = [(l.val, i, l) for i, l in enumerate(lists) if l]   #@init
    heapq.heapify(heap)
    dummy = tail = ListNode()
    while heap:                                     #@loop
        val, i, node = heapq.heappop(heap)          #@pop
        tail.next = tail = node                     #@link
        if node.next:
            heapq.heappush(heap, (node.next.val, i, node.next))  #@push
    return dummy.next                               #@ret`,
    inputs: [{ label: 'Three lists', v: { lists: [[1, 4, 5], [1, 3, 4], [2, 6]] }, expect: [1, 1, 2, 3, 4, 4, 5, 6] }, { label: 'Four lists', v: { lists: [[2, 9], [1, 7], [5], [3, 4, 8]] }, expect: [1, 2, 3, 4, 5, 7, 8, 9] }],
    validate: (i) => (i.lists.length > 4 || i.lists.flat().length > 12 ? 'Use at most 4 lists and 12 nodes in total.' : null),
    run({ lists }, T) {
      const rows = lists.map((l) => buildList(l));
      const dummy = ListNode('D');
      const all = [dummy, ...rows.flat()];
      const pos = {}; const K = rows.length;
      rows.forEach((r, ri) => r.forEach((n, ci) => (pos[n.id] = [ci + 1, ri])));
      pos[dummy.id] = [0, K + 0.3];
      // min-heap of [val, i, node]
      const hp = [];
      const less = (a, b) => (a[0] !== b[0] ? a[0] < b[0] : a[1] < b[1]);
      const push = (x) => { hp.push(x); let i = hp.length - 1; while (i) { const p = (i - 1) >> 1; if (less(hp[i], hp[p])) { [hp[i], hp[p]] = [hp[p], hp[i]]; i = p; } else break; } };
      const pop = () => { const top = hp[0], last = hp.pop(); if (hp.length) { hp[0] = last; let i = 0; for (;;) { const l = 2 * i + 1, r = l + 1; let m = i; if (l < hp.length && less(hp[l], hp[m])) m = l; if (r < hp.length && less(hp[r], hp[m])) m = r; if (m === i) break; [hp[i], hp[m]] = [hp[m], hp[i]]; i = m; } } return top; };
      const hv = (o) => heapV('min-heap (value, list)', hp.map(([v, i]) => `${v}·L${i}`), o);
      const view = (o) => L(`lists L0…L${K - 1} · merged row at the bottom`, all, { pos: { ...pos }, nulls: false, ...o });
      rows.forEach((r, i) => { if (r[0]) push([r[0].val, i, r[0]]); });
      let tail = dummy, k = 0;
      T.step('init', `Heap starts with the ${hp.length} list heads.`, view({ p: { tail } }), hv({}));
      while (hp.length) {
        const [val, i, node] = pop();
        T.step('pop', `Pop the smallest head: ${val} from L${i}.`, view({ p: { tail }, hl: [[node, 'a']] }), hv({}));
        tail.next = node; tail = node;
        pos[node.id] = [++k, K + 0.3];
        T.step('link', `Append ${val} to the merged list.`, view({ p: { tail }, hl: [[node, 'done']] }), hv({}));
        if (node.next) {
          push([node.next.val, i, node.next]);
          T.step('push', `L${i} still has ${node.next.val}. Push it into the heap.`, view({ p: { tail }, hl: [[node.next, 'b']] }), hv({ hl: { [hp.findIndex((x) => x[2] === node.next)]: 'a' } }));
        }
      }
      T.step('ret', 'Heap is empty. Return dummy.next.', view({ p: { head: dummy.next }, hl: [[dummy, 'mute']] }), hv({}));
      return listToArr(dummy.next);
    },
  });
})();

(function () {
  const { problem, V, buildTree, treeToArr, TreeNode } = TL;
  const { arr, stack, vars } = V;
  // o.hl / o.tags: arrays of [node, value]; o.p: {name: node}
  const tv = (label, root, o = {}) => {
    const out = { ...o };
    if (o.hl) out.hl = Object.fromEntries(o.hl.filter((x) => x && x[0]).map(([n, c]) => [n.id, c]));
    if (o.tags) out.tags = Object.fromEntries(o.tags.filter((x) => x && x[0]).map(([n, t]) => [n.id, t]));
    if (o.p) { out.p = {}; for (const k in o.p) if (o.p[k]) out.p[k] = o.p[k].id; }
    return V.tree(label, root, out);
  };
  const size = (a) => a.filter((x) => x !== null).length;
  const treeOk = (k, n) => (i) => (size(i[k]) > n ? `Keep the tree to ${n} nodes.` : null);
  const nodesOf = (root) => { const o = []; const w = (n) => { if (n) { o.push(n); w(n.left); w(n.right); } }; w(root); return o; };

  problem({
    id: 'invert-binary-tree', n: 226, title: 'Invert Binary Tree', diff: 'Easy', pattern: 'trees', blind: true,
    prompt: 'Mirror a binary tree: swap the left and right child of every node.',
    insight: 'Inverting a tree = swap the two children at the root, then invert each subtree. Any traversal order works.',
    approach: ['Base case: an empty tree is already inverted.', 'Swap root.left and root.right.', 'Recurse into both children.'],
    pitfalls: ['Swapping after recursing on only one side inverts that side twice.', 'Iterative BFS with a queue avoids deep recursion.'],
    time: 'O(n)', space: 'O(h)',
    code: `
def invertTree(root):
    if not root:                                   #@base
        return None
    root.left, root.right = root.right, root.left  #@swap
    invertTree(root.left)                          #@recl
    invertTree(root.right)                         #@recr
    return root                                    #@ret`,
    inputs: [{ label: 'Classic', v: { root: [4, 2, 7, 1, 3, 6, 9] }, expect: [4, 7, 2, 9, 6, 3, 1] }, { label: 'Lopsided', v: { root: [1, 2, null, 3, null, 4] }, expect: [1, null, 2, null, 3, null, 4] }],
    validate: treeOk('root', 15),
    run({ root: R }, T) {
      const root = buildTree(R), calls = [];
      const done = [];
      const go = (n) => {
        if (!n) return null;
        calls.push('invert(' + n.val + ')');
        [n.left, n.right] = [n.right, n.left];
        T.step('swap', `At ${n.val}: swap its children.`, tv('tree', root, { hl: [[n, 'a'], ...done.map((d) => [d, 'done'])] }), stack('call stack', calls));
        go(n.left); go(n.right);
        done.push(n);
        calls.pop();
        T.step('ret', `Both subtrees of ${n.val} are inverted. Return.`, tv('tree', root, { hl: [[n, 'ok'], ...done.map((d) => [d, d === n ? 'ok' : 'done'])] }), stack('call stack', calls));
        return n;
      };
      T.step('base', 'Start at the root.', tv('tree', root, {}), stack('call stack', calls));
      go(root);
      return treeToArr(root);
    },
  });

  problem({
    id: 'maximum-depth-of-binary-tree', n: 104, title: 'Maximum Depth of Binary Tree', diff: 'Easy', pattern: 'trees', blind: true,
    prompt: 'Return the number of nodes on the longest root-to-leaf path.',
    insight: 'depth(node) = 1 + max(depth(left), depth(right)), and an empty tree has depth 0. Each node asks its children, then reports up.',
    approach: ['Return 0 for None.', 'Get the depth of each subtree.', 'Return 1 + the larger one.'],
    pitfalls: ['Returning 1 for None counts phantom nodes.', 'BFS level counting is the iterative alternative.'],
    time: 'O(n)', space: 'O(h)',
    code: `
def maxDepth(root):
    if not root:                         #@base
        return 0
    left = maxDepth(root.left)           #@left
    right = maxDepth(root.right)         #@right
    return 1 + max(left, right)          #@ret`,
    inputs: [{ label: 'Classic', v: { root: [3, 9, 20, null, null, 15, 7] }, expect: 3 }, { label: 'Deep left', v: { root: [1, 2, 3, 4, null, null, null, 5] }, expect: 4 }],
    validate: treeOk('root', 15),
    run({ root: R }, T) {
      const root = buildTree(R), calls = [], tags = [];
      const go = (n) => {
        if (!n) return 0;
        calls.push('depth(' + n.val + ')');
        T.step('left', `At ${n.val}: ask the left subtree first.`, tv('tree', root, { hl: [[n, 'a']], tags }), stack('call stack', calls));
        const l = go(n.left);
        T.step('right', `Left of ${n.val} has depth ${l}. Now ask the right.`, tv('tree', root, { hl: [[n, 'a']], tags }), stack('call stack', calls), vars({ left: l }));
        const r = go(n.right);
        const d = 1 + Math.max(l, r);
        tags.push([n, 'd=' + d]);
        calls.pop();
        T.step('ret', `${n.val}: 1 + max(${l}, ${r}) = ${d}. Report up.`, tv('tree', root, { hl: [[n, 'ok']], tags }), stack('call stack', calls), vars({ left: l, right: r, depth: d }));
        return d;
      };
      T.step('base', 'Each node will be tagged with the depth it reports.', tv('tree', root, {}), stack('call stack', calls));
      return go(root);
    },
  });

    prompt: 'Are two binary trees identical in shape and values?',

    pitfalls: ['Checking only values (not None-ness) crashes on .val.', 'Comparing traversals alone can miss shape differences.'],
    time: 'O(n)', space: 'O(h)',
    code: `
def isSameTree(p, q):
    if not p and not q:                      #@both
        return True
    if not p or not q or p.val != q.val:     #@diff
        return False
    return (isSameTree(p.left, q.left) and   #@rec

    inputs: [{ label: 'Same', v: { p: [1, 2, 3, 4], q: [1, 2, 3, 4] }, expect: true }, { label: 'Shape differs', v: { p: [1, 2], q: [1, null, 2] }, expect: false }, { label: 'Value differs', v: { p: [5, 3, 8, 1], q: [5, 3, 9, 1] }, expect: false }],
    validate: (i) => (size(i.p) > 10 || size(i.q) > 10 ? 'Keep each tree to 10 nodes.' : null),
    run({ p: P, q: Q }, T) {
      const a = buildTree(P), b = buildTree(Q), okA = [], okB = [];
      const views = (x, y, c) => [tv('p', a, { hl: [...okA.map((n) => [n, 'ok']), [x, c]] }), tv('q', b, { hl: [...okB.map((n) => [n, 'ok']), [y, c]] })];
      const go = (x, y) => {

        okA.push(x); okB.push(y);
        return go(x.left, y.left) && go(x.right, y.right);
      };
      T.step('both', 'Walk both trees together.', ...views(null, null));
      const r = go(a, b);
      if (r) T.step('both', 'Every pair matched. Same tree.', ...views(null, null));

    },

  problem({
    id: 'subtree-of-another-tree', n: 572, title: 'Subtree of Another Tree', diff: 'Easy', pattern: 'trees', blind: true,
    prompt: 'Does root contain a subtree identical to subRoot?',

def isSubtree(root, sub):

        return a.val == b.val and same(a.left, b.left) and same(a.right, b.right)
    if not root:                                  #@none

    if same(root, sub):                           #@same

    best = float('-inf')
    def gain(node):
        nonlocal best

            return 0
        left = max(gain(node.left), 0)             #@left
        right = max(gain(node.right), 0)           #@right

    out = []
    def dfs(node):
        if not node:
            out.append('#'); return          #@null
        out.append(str(node.val))            #@val

    return ','.join(out)                     #@join

def deserialize(data):

    def build():
        v = next(vals)
        if v == '#': return None             #@dnull

        node.left = build()
        node.right = build()
        return node

class Trie:
    def __init__(self):
        self.root = {}                          #@init
    def insert(self, word):
        node = self.root
        for ch in word:
            node = node.setdefault(ch, {})      #@ins
        node['$'] = True                        #@end

        for ch in s:

            node = node[ch]                     #@walk

(function () {

  problem({
    id: 'kth-largest-element-in-an-array', n: 215, title: 'Kth Largest Element in an Array', diff: 'Medium', pattern: 'heap', blind: false,
    prompt: 'Return the k-th largest element of nums (k-th in sorted order, duplicates count).',
    insight: 'Keep a min-heap of the k largest values seen so far. Its root is the smallest of them, which is exactly the k-th largest.',
    approach: ['Push each value.', 'If the heap grows past k, pop the smallest.', 'At the end the root is the answer.'],
    pitfalls: ['A max-heap of all n values works but costs O(n) space.', 'Quickselect is O(n) on average and a good follow-up to mention.'],
    time: 'O(n log k)', space: 'O(k)',
    code: `
def findKthLargest(nums, k):
    heap = []                          #@init
    for x in nums:
        heapq.heappush(heap, x)        #@push
        if len(heap) > k:
            heapq.heappop(heap)        #@pop
    return heap[0]                     #@ret`,
    inputs: [{ label: 'k = 2', v: { nums: [3, 2, 1, 5, 6, 4], k: 2 }, expect: 5 }, { label: 'k = 4', v: { nums: [3, 2, 3, 1, 2, 4, 5, 5, 6], k: 4 }, expect: 4 }],

    run({ nums, k }, T) {
      const h = new Heap();
      T.step('init', `Min-heap that will hold the ${k} largest values.`, arr('nums', nums), heapV('min-heap', h.a), arr('heap as array', h.a));
      nums.forEach((x, i) => {
        let pos = h.push(x, (p, c) => T.step('push', `Sift up: ${h.a[c]} > ${h.a[p]}, swap so the parent stays smaller.`, arr('nums', nums, { p: { i } }), heapV('min-heap', h.a, { hl: { [p]: 'a', [c]: 'b' } }), arr('heap as array', h.a, { hl: { [p]: 'a', [c]: 'b' } })));
        T.step('push', `Push ${x}.`, arr('nums', nums, { p: { i }, hl: { [i]: 'a' } }), heapV('min-heap', h.a, { hl: { [pos]: 'a' } }), arr('heap as array', h.a, { hl: { [pos]: 'a' } }));
        if (h.size > k) {
          const small = h.peek();
          T.step('pop', `Heap has ${h.size} > ${k} values. Pop the smallest (${small}); it cannot be in the top ${k}.`, arr('nums', nums, { p: { i } }), heapV('min-heap', h.a, { hl: { 0: 'bad' } }), arr('heap as array', h.a, { hl: { 0: 'bad' } }));
          h.pop((p, c) => T.step('pop', `Sift down: swap ${h.a[c]} with its smaller child ${h.a[p]}.`, arr('nums', nums, { p: { i } }), heapV('min-heap', h.a, { hl: { [p]: 'a', [c]: 'b' } }), arr('heap as array', h.a, { hl: { [p]: 'a', [c]: 'b' } })));

  problem({
    id: 'find-median-from-data-stream', n: 295, title: 'Find Median from Data Stream', diff: 'Hard', pattern: 'heap', blind: true,
    prompt: 'Numbers arrive one at a time. After each one, report the median of everything so far.',
    insight: 'Split the numbers into a smaller half (max-heap) and a larger half (min-heap) with sizes equal or the low half one bigger. The median sits on the heap tops.',
    approach: ['Push x into lo, then move lo\'s max to hi. This keeps every lo value ≤ every hi value.', 'If hi got bigger than lo, move hi\'s min back.', 'Median = lo top (odd count) or the average of both tops.'],
    pitfalls: ['Python only has min-heaps: store negatives in lo.', 'Sorting on every query is O(n log n) per call.'],
    time: 'O(log n) add · O(1) median', space: 'O(n)',
    code: `
class MedianFinder:
    def __init__(self):
        self.lo = []  # max-heap via negatives: smaller half   #@init
        self.hi = []  # min-heap: larger half
    def addNum(self, x):
        heapq.heappush(self.lo, -x)                        #@pushlo
        heapq.heappush(self.hi, -heapq.heappop(self.lo))   #@move
        if len(self.hi) > len(self.lo):
            heapq.heappush(self.lo, -heapq.heappop(self.hi))   #@balance
    def findMedian(self):
        if len(self.lo) > len(self.hi):
            return -self.lo[0]                             #@odd
        return (-self.lo[0] + self.hi[0]) / 2              #@even`,
    inputs: [{ label: 'Stream', v: { stream: [5, 15, 1, 3, 8, 7] }, expect: [5, 10, 5, 4, 5, 6] }, { label: 'Rising', v: { stream: [1, 2, 3, 4, 5] }, expect: [1, 1.5, 2, 2.5, 3] }],
    validate: (i) => (i.stream.length > 10 ? 'Keep to 10 numbers.' : null),
    run({ stream }, T) {
      const lo = new Heap((a, b) => a > b), hi = new Heap((a, b) => a < b), meds = [];
      const views = (hlLo, hlHi, i) => [arr('stream', stream, { p: i !== undefined ? { next: i } : undefined }), heapV('lo: max-heap (smaller half)', lo.a, { hl: hlLo }), heapV('hi: min-heap (larger half)', hi.a, { hl: hlHi }), arr('medians', meds)];
      T.step('init', 'Two empty halves.', ...views({}, {}));
      stream.forEach((x, i) => {
        const p = lo.push(x);
        T.step('pushlo', `Add ${x}: push it into lo first.`, ...views({ [p]: 'a' }, {}, i));
        const m = lo.pop();
        const q = hi.push(m);
        T.step('move', `Move lo's largest (${m}) to hi, so every lo value ≤ every hi value.`, ...views({}, { [q]: 'a' }, i));
        if (hi.size > lo.size) {
          const b = hi.pop();
          const r = lo.push(b);
          T.step('balance', `hi has more values. Move its smallest (${b}) back to lo.`, ...views({ [r]: 'a' }, {}, i));
        }
        const med = lo.size > hi.size ? lo.peek() : (lo.peek() + hi.peek()) / 2;
        meds.push(med);
        T.step(lo.size > hi.size ? 'odd' : 'even', lo.size > hi.size ? `Odd count: median = top of lo = ${med}.` : `Even count: median = (${lo.peek()} + ${hi.peek()}) / 2 = ${med}.`, ...views({ 0: 'ok' }, lo.size > hi.size ? {} : { 0: 'ok' }, i));
      });
      return meds;
    },
  });
})();

(function () {

  // Decision tree that grows as the search explores it.
  function DTree() {
    let id = 0;
    const root = { id: 'd' + id++, v: '·', c: [] };
    const cls = {};
    return {
      root, cls,
      add(parent, label) { const n = { id: 'd' + id++, v: label, c: [] }; parent.c.push(n); return n; },
      view(cur, label) { const hl = { ...cls }; if (cur) hl[cur.id] = 'a'; return V.ntree(label || 'recursion tree', root, { hl, dx: 38, dy: 50 }); },
    };

    prompt: 'Return every subset (the power set) of nums, which has unique values.',
    insight: 'Every node of the recursion tree is a subset. From each node, only add elements after the last one used (start index), so no subset appears twice.',
    approach: ['Record the current path on entry.', 'For i from start: choose nums[i], recurse with i + 1, un-choose.', 'There are 2ⁿ nodes, one per subset.'],
    pitfalls: ['Append a copy (path[:]), not path itself.', 'Looping from 0 instead of start produces permutations and duplicates.'],
    time: 'O(n · 2ⁿ)', space: 'O(n)',

def subsets(nums):
    res, path = [], []
    def backtrack(start):
        res.append(path[:])                  #@record
        for i in range(start, len(nums)):
            path.append(nums[i])             #@choose
            backtrack(i + 1)
            path.pop()                       #@undo
    backtrack(0)
    return res`,

    insight: 'Same shape as Subsets, but recursing with i (not i + 1) lets you reuse a number, and the remaining sum prunes branches that overshoot.',

def combinationSum(candidates, target):
    res, path = [], []

        if not (0 <= r < R and 0 <= c < C) or grid[r][c] != '1':
            return

def pacificAtlantic(heights):

            r, c = q.popleft()

def validTree(n, edges):
    if len(edges) != n - 1:
        return False                          #@count
    parent = list(range(n))                   #@init
    def find(x):
        while parent[x] != x:
            parent[x] = parent[parent[x]]     # path halving
            x = parent[x]
        return x
    for a, b in edges:
        ra, rb = find(a), find(b)             #@find
        if ra == rb:
            return False                      #@cycle
        parent[ra] = rb                       #@union
    return True                               #@ret`,
    inputs: [{ label: 'Tree', v: { n: 5, edges: [[0, 1], [0, 2], [0, 3], [1, 4]] }, expect: true }, { label: 'Cycle', v: { n: 5, edges: [[0, 1], [1, 2], [2, 3], [1, 3]] }, expect: false }],
    validate: (i) => (i.n > 8 ? 'Keep n to 8 nodes.' : null),
    run({ n, edges }, T) {
      const parent = Array.from({ length: n }, (_, i) => i);
      if (edges.length !== n - 1) { T.step('count', `${edges.length} edges, but a tree on ${n} nodes needs exactly ${n - 1}. False.`, ...ufViews(n, edges, parent, {}, {})); return false; }
      const used = [];
      T.step('init', 'Each node starts as its own root.', ...ufViews(n, [], parent, {}, {}));
      const find = (x) => { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
      for (const [a, b] of edges) {
        const ra = find(a), rb = find(b);
        T.step('find', `Edge ${a}–${b}: root(${a}) = ${ra}, root(${b}) = ${rb}.`, ...ufViews(n, [...used, [a, b]], parent, { [a]: 'a', [b]: 'a', [ra]: 'b', [rb]: 'b' }, { [a + '-' + b]: 'a' }));
        if (ra === rb) { T.step('cycle', `Same root: ${a} and ${b} are already connected, so this edge closes a cycle. False.`, ...ufViews(n, [...used, [a, b]], parent, { [a]: 'bad', [b]: 'bad' }, { [a + '-' + b]: 'a' })); return false; }
        parent[ra] = rb; used.push([a, b]);
        T.step('union', `Different roots. Union: parent[${ra}] = ${rb}.`, ...ufViews(n, used, parent, { [ra]: 'ok', [rb]: 'ok' }, { [a + '-' + b]: 'ok' }));

def alienOrder(words):
    adj = {c: set() for w in words for c in w}        #@nodes
    indeg = {c: 0 for c in adj}
    for w1, w2 in zip(words, words[1:]):
        for a, b in zip(w1, w2):
            if a != b:
                if b not in adj[a]:
                    adj[a].add(b); indeg[b] += 1      #@edge
                break
        else:
            if len(w1) > len(w2):
                return ""                              #@bad
    q = deque(c for c in indeg if indeg[c] == 0)       #@seed
    order = []

        c = q.popleft(); order.append(c)              #@take
        for d in adj[c]:
            indeg[d] -= 1
            if indeg[d] == 0:
                q.append(d)                           #@ready
    return ''.join(order) if len(order) == len(indeg) else ""   #@ret`,

      const adj = Object.fromEntries(letters.map((c) => [c, []])), indeg = Object.fromEntries(letters.map((c) => [c, 0]));

      const gv = (hl, ehl) => { const h = {}; done.forEach((d) => (h[d] = 'done')); return graph('letter rules (a → b means a before b)', nodes, edges.slice(), { directed: true, hl: { ...h, ...hl }, ehl, tags: Object.fromEntries(letters.map((c) => [c, done.has(c) ? '✓' : 'in ' + indeg[c]])) }); };
      T.step('nodes', `Letters: ${letters.join(', ')}. Compare each word with the next.`, arr('words', words), gv({}));
      for (let k = 0; k + 1 < words.length; k++) {
        const w1 = words[k], w2 = words[k + 1];

def networkDelayTime(times, n, k):

        return n
    dp = [0] * (n + 1)              #@init

    approach: ['Fill row 0 and column 0 with 1.', 'Every other cell = top + left.', 'Answer is the bottom-right cell.'],
    pitfalls: ['One row of size n is enough: dp[c] += dp[c − 1].', 'The closed form C(m + n − 2, m − 1) is a nice follow-up.'],
    time: 'O(m · n)', space: 'O(m · n), or O(n)',
    code: `
def uniquePaths(m, n):
    dp = [[1] * n for _ in range(m)]                 #@init
    for r in range(1, m):
        for c in range(1, n):
            dp[r][c] = dp[r - 1][c] + dp[r][c - 1]   #@fill
    return dp[m - 1][n - 1]                          #@ret`,
    inputs: [{ label: '3 × 7', v: { m: 3, n: 7 }, expect: 28 }, { label: '4 × 4', v: { m: 4, n: 4 }, expect: 20 }],
    validate: (i) => (i.m < 1 || i.n < 1 || i.m > 7 || i.n > 8 ? 'Use m ≤ 7 and n ≤ 8.' : null),
    run({ m, n }, T) {
      const dp = Array.from({ length: m }, (_, r) => Array.from({ length: n }, (_, c) => (r === 0 || c === 0 ? 1 : null)));
      const ok = {}; for (let r = 0; r < m; r++) ok[r + ',0'] = 'done'; for (let c = 0; c < n; c++) ok['0,' + c] = 'done';
      T.step('init', 'The top row and left column can only be reached one way.', grid('dp (paths to each cell)', dp, { hl: ok }));
      for (let r = 1; r < m; r++) for (let c = 1; c < n; c++) {
        dp[r][c] = dp[r - 1][c] + dp[r][c - 1];
        T.step('fill', `(${r},${c}) = above ${dp[r - 1][c]} + left ${dp[r][c - 1]} = ${dp[r][c]}.`, grid('dp (paths to each cell)', dp, { hl: { [r + ',' + c]: 'a', [(r - 1) + ',' + c]: 'b', [r + ',' + (c - 1)]: 'b' } }));
      }
      T.step('ret', `${dp[m - 1][n - 1]} paths.`, grid('dp (paths to each cell)', dp, { hl: { [(m - 1) + ',' + (n - 1)]: 'ok' } }));
      return dp[m - 1][n - 1];
    },
  });

  problem({
    id: 'longest-common-subsequence', n: 1143, title: 'Longest Common Subsequence', diff: 'Medium', pattern: 'dp-2d', blind: true,
    prompt: 'Return the length of the longest subsequence common to strings a and b.',
    insight: 'dp[i][j] = LCS of the first i letters of a and the first j letters of b. If the last letters match, take the diagonal + 1; otherwise drop a letter from one string: max(top, left).',
    approach: ['Row 0 and column 0 are 0 (an empty string).', 'Match: dp[i][j] = dp[i−1][j−1] + 1.', 'No match: dp[i][j] = max(dp[i−1][j], dp[i][j−1]).'],
    pitfalls: ['Off by one: dp[i][j] compares a[i−1] with b[j−1].', 'A subsequence keeps order but may skip letters; a substring does not skip.'],
    time: 'O(n · m)', space: 'O(n · m)',
    code: `
def longestCommonSubsequence(a, b):
    dp = [[0] * (len(b) + 1) for _ in range(len(a) + 1)]   #@init
    for i in range(1, len(a) + 1):
        for j in range(1, len(b) + 1):
            if a[i - 1] == b[j - 1]:
                dp[i][j] = dp[i - 1][j - 1] + 1              #@match
            else:
                dp[i][j] = max(dp[i - 1][j], dp[i][j - 1])   #@skip
    return dp[len(a)][len(b)]                                #@ret`,
    inputs: [{ label: 'abcde / ace', v: { a: 'abcde', b: 'ace' }, expect: 3 }, { label: 'Longer', v: { a: 'AGGTAB', b: 'GXTXAYB' }, expect: 4 }],
    validate: (i) => (i.a.length > 8 || i.b.length > 8 ? 'Keep each string to 8 letters.' : null),
    run({ a, b }, T) {
      const n = a.length, m = b.length;
      const dp = Array.from({ length: n + 1 }, () => Array(m + 1).fill(0));
      const gv = (hl) => grid('dp', dp, { rowLabels: ['∅', ...a], colLabels: ['∅', ...b], hl });
      T.step('init', 'An empty prefix has nothing in common: first row and column are 0.', gv({}));
      for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++) {
        if (a[i - 1] === b[j - 1]) {
          dp[i][j] = dp[i - 1][j - 1] + 1;
          T.step('match', `'${a[i - 1]}' = '${b[j - 1]}': diagonal ${dp[i - 1][j - 1]} + 1 = ${dp[i][j]}.`, gv({ [i + ',' + j]: 'ok', [(i - 1) + ',' + (j - 1)]: 'b' }));
        } else {
          dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
          T.step('skip', `'${a[i - 1]}' ≠ '${b[j - 1]}': max(top ${dp[i - 1][j]}, left ${dp[i][j - 1]}) = ${dp[i][j]}.`, gv({ [i + ',' + j]: 'a', [(i - 1) + ',' + j]: 'b', [i + ',' + (j - 1)]: 'b' }));
        }
      }
      T.step('ret', `LCS length ${dp[n][m]}.`, gv({ [n + ',' + m]: 'ok' }));
      return dp[n][m];
    },
  });

  problem({
    id: 'maximum-subarray', n: 53, title: 'Maximum Subarray', diff: 'Medium', pattern: 'greedy', blind: true,
    prompt: 'Return the largest sum of a contiguous, non-empty subarray.',
    insight: 'Kadane: a running sum that has gone negative only hurts whatever comes next, so drop it and start fresh at the current element.',
    approach: ['cur = best subarray sum ending here.', 'cur = max(x, cur + x): extend or restart.', 'best = max(best, cur).'],
    pitfalls: ['Initialize with nums[0], not 0, for all-negative arrays.', 'Divide and conquer is O(n log n) and a common follow-up.'],
    time: 'O(n)', space: 'O(1)',
    code: `
def maxSubArray(nums):
    cur = best = nums[0]                     #@init
    for x in nums[1:]:
        cur = max(x, cur + x)                #@step
        best = max(best, cur)
    return best                              #@ret`,
    inputs: [{ label: 'Classic', v: { nums: [-2, 1, -3, 4, -1, 2, 1, -5, 4] }, expect: 6 }, { label: 'All negative', v: { nums: [-3, -1, -2] }, expect: -1 }],
    validate: (i) => (i.nums.length > 14 ? 'Keep nums to 14 values.' : null),
    run({ nums }, T) {
      let cur = nums[0], best = nums[0], start = 0, bs = 0, be = 0;
      T.step('init', 'Start with the first element.', arr('nums', nums, { win: [0, 0], p: { i: 0 } }), vars({ cur, best }));
      for (let i = 1; i < nums.length; i++) {
        const x = nums[i];
        if (x > cur + x) { cur = x; start = i; T.step('step', `The running sum was negative, so it only drags ${x} down. Restart at ${x}.`, arr('nums', nums, { win: [start, i], p: { i }, hl: { [i]: 'a' } }), vars({ cur, best })); }
        else { cur = cur + x; T.step('step', `Extend: cur = ${cur - x} + ${x} = ${cur}.`, arr('nums', nums, { win: [start, i], p: { i }, hl: { [i]: 'a' } }), vars({ cur, best })); }
        if (cur > best) { best = cur; bs = start; be = i; }
      }
      const hl = {}; for (let k = bs; k <= be; k++) hl[k] = 'ok';
      T.step('ret', `Best sum ${best}, from index ${bs} to ${be}.`, arr('nums', nums, { hl }), vars({ best }));
      return best;
    },
  });

  problem({
    id: 'jump-game', n: 55, title: 'Jump Game', diff: 'Medium', pattern: 'greedy', blind: true,
    prompt: 'nums[i] is the maximum jump length from index i. Starting at 0, can you reach the last index?',
    insight: 'Track the furthest index reachable so far. If the scan ever stands on an index beyond that, you are stuck.',
    approach: ['reach = 0.', 'For each i: if i > reach, return False.', 'reach = max(reach, i + nums[i]).'],
    pitfalls: ['A DP over every jump length is O(n²).', 'You can stop early once reach ≥ last index.'],
    time: 'O(n)', space: 'O(1)',
    code: `
def canJump(nums):
    reach = 0                                #@init
    for i, x in enumerate(nums):
        if i > reach:
            return False                     #@stuck
        reach = max(reach, i + x)            #@reach
    return True                              #@ret`,
    inputs: [{ label: 'Reachable', v: { nums: [2, 3, 1, 1, 4] }, expect: true }, { label: 'Stuck at 0', v: { nums: [3, 2, 1, 0, 4] }, expect: false }],
    validate: (i) => (i.nums.length > 14 ? 'Keep nums to 14 values.' : null),
    run({ nums }, T) {
      let reach = 0;
      const rv = (i, hl) => arr('nums', nums, { p: { i, reach: Math.min(reach, nums.length - 1) }, win: [0, Math.min(reach, nums.length - 1)], hl });
      T.step('init', 'Only index 0 is reachable so far.', rv(0, {}), vars({ reach }));
      for (let i = 0; i < nums.length; i++) {
        if (i > reach) { T.step('stuck', `Index ${i} is beyond the furthest reach (${reach}). Stuck.`, rv(i, { [i]: 'bad' }), vars({ reach })); return false; }
        const nr = Math.max(reach, i + nums[i]);
        T.step('reach', nr > reach ? `From ${i} you can jump to ${i + nums[i]}. reach → ${nr}.` : `From ${i} you reach ${i + nums[i]}, no further than ${reach}.`, rv(i, { [i]: 'a' }), vars({ reach: nr }));
        reach = nr;
      }
      T.step('ret', 'The scan reached the last index. True.', rv(nums.length - 1, { [nums.length - 1]: 'ok' }), vars({ reach }));
      return true;
    },
  });
})();
